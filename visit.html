<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ویزیت آنلاین | دکتر محمدصادق تاج</title>
<meta name="robots" content="noindex">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  :root {
    --dark-blue: #0f172a;
    --card: #162033;
    --card-2: #1e293b;
    --teal: #14b8a6;
    --blue: #0284c7;
    --ink: #e2e8f0;
    --muted: #94a3b8;
    --line: rgba(255,255,255,.12);
    --danger: #ef4444;
    --video: #020617;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Vazirmatn", Tahoma, system-ui, sans-serif;
    background: var(--dark-blue);
    color: var(--ink);
    line-height: 1.8;
  }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }

  .app {
    max-width: 1120px; margin: 0 auto; padding: 16px;
    display: grid; grid-template-columns: 1fr 330px; gap: 16px; min-height: 100%;
  }
  header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 1.2rem; margin: 0; }
  .back { color: var(--muted); text-decoration: none; font-size: .9rem; }
  .back:hover { color: #fff; }
  #status { font-size: .9rem; color: var(--muted); }

  .stage { position: relative; background: var(--video); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 10; min-height: 260px; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: var(--video); }
  #localVideo { position: absolute; bottom: 12px; left: 12px; width: 26%; min-width: 96px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; border: 2px solid rgba(255,255,255,.35); background: #000; transform: scaleX(-1); }
  #placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); text-align: center; padding: 24px; pointer-events: none; }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .btn { border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--ink); border-radius: 10px; padding: 10px 16px; font-weight: 600; font-size: .9rem; transition: background .2s; }
  .btn:hover { background: rgba(255,255,255,.1); }
  .btn.primary { background: linear-gradient(135deg, var(--blue), var(--teal)); border-color: transparent; color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.off { background: rgba(239,68,68,.15); border-color: rgba(239,68,68,.5); color: #fca5a5; }
  .btn[disabled] { opacity: .4; cursor: not-allowed; }

  #linkBox { margin-top: 12px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; display: none; gap: 8px; align-items: center; flex-wrap: wrap; }
  #linkBox input { flex: 1; min-width: 200px; direction: ltr; text-align: left; border: 1px solid var(--line); background: var(--dark-blue); color: var(--ink); border-radius: 8px; padding: 8px; font: inherit; font-size: .85rem; }
  #msg { margin-top: 10px; color: #fca5a5; min-height: 1.5em; font-size: .95rem; }

  .chat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; min-height: 360px; max-height: calc(100vh - 100px); }
  .chat h2 { font-size: 1rem; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .m { max-width: 85%; padding: 8px 12px; border-radius: 12px; word-break: break-word; white-space: pre-wrap; }
  .m.me { align-self: flex-start; background: var(--blue); color: #fff; border-end-start-radius: 4px; }
  .m.them { align-self: flex-end; background: var(--card-2); border-end-end-radius: 4px; }
  .m.sys { align-self: center; background: none; color: var(--muted); font-size: .85rem; }
  .send { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  .send input { flex: 1; border: 1px solid var(--line); background: var(--dark-blue); color: var(--ink); border-radius: 10px; padding: 10px; font: inherit; min-width: 0; }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; padding: 10px; }
    .chat { min-height: 300px; max-height: none; }
  }

  .queue { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: none; }
  .queue h3 { margin: 0 0 8px; font-size: .95rem; }
  .q-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .q-row:first-of-type { border-top: 0; }
  .note { margin-top: 12px; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>اتاق جلسه ویزیت</h1>
    <a class="back" href="panel.html">بازگشت به پنل</a>
    <span id="status" role="status">آماده</span>
  </header>

  <main>
    <div class="stage">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
      <div id="placeholder">برای شروع جلسه وارد اتاق شوید.</div>
    </div>

    <div class="controls">
      <button class="btn primary" id="joinBtn">ورود به اتاق جلسه</button>
      <button class="btn" id="micBtn" disabled>قطع میکروفن</button>
      <button class="btn" id="camBtn" disabled>خاموش کردن دوربین</button>
      <button class="btn danger" id="hangBtn" disabled>پایان جلسه</button>
    </div>

    <div class="queue" id="queue"><h3>بیماران منتظر</h3><div id="queueList"></div></div>
    <div class="note" id="note"></div>
    <div id="msg" role="alert"></div>
  </main>

  <aside class="chat">
    <h2>گفتگوی متنی</h2>
    <div id="log"></div>
    <div class="send">
      <input id="chatInput" placeholder="پیام خود را بنویسید" disabled autocomplete="off">
      <button class="btn primary" id="sendBtn" disabled>ارسال</button>
    </div>
  </aside>
</div>

<script>
(function () {
  var KEY = "taj_medical_proxy_auth_v1";
  // ⚠️ بدون سرور TURN، اتصال بین دو شبکه‌ی مختلف (به‌خصوص موبایل/اینترنت ایران) معمولاً برقرار نمی‌شود.
  // مقادیر TURN_HOST / USER / PASS را با اطلاعات سرور TURN خودتان عوض کنید.
  var ICE = [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
    {
      urls: [
        "turn:TURN_HOST:3478?transport=udp",
        "turn:TURN_HOST:3478?transport=tcp",
        "turns:TURN_HOST:443?transport=tcp"
      ],
      username: "TURN_USER",
      credential: "TURN_PASS"
    }
  ];
  var cand = { host: 0, srflx: 0, relay: 0 }, connectTimer;

  var $ = function (i) { return document.getElementById(i); };
  var session = null, role = null, room = null, since = 0, side = null;
  var pc, dc, localStream, pollTimer, queueTimer, connected = false, pendingIce = [], sendChain = Promise.resolve();

  try { session = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}

  function setStatus(t) { $("status").textContent = t; }
  function setMsg(t) { $("msg").textContent = t || ""; }
  function addLog(t, c) { var d = document.createElement("div"); d.className = "m " + c; d.textContent = t; $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight; }

  /* ---------- API با تمدید خودکار توکن ---------- */
  function api(path, opt, retry) {
    opt = opt || {};
    var h = { "Content-Type": "application/json" };
    if (session && session.idToken) h.Authorization = "Bearer " + session.idToken;
    return fetch("/api" + path, { method: opt.method || "GET", headers: h, body: opt.body }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.status === 401 && retry !== false && session && session.refreshToken) {
          return fetch("/api/auth/refresh", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ refreshToken: session.refreshToken }) })
            .then(function (x) { return x.json(); })
            .then(function (n) {
              if (!n.idToken) throw new Error("UNAUTHENTICATED");
              session.idToken = n.idToken; session.refreshToken = n.refreshToken || session.refreshToken;
              localStorage.setItem(KEY, JSON.stringify(session));
              return api(path, opt, false);
            });
        }
        if (!r.ok) { var e = new Error(j.error || "ERROR"); e.code = j.error; throw e; }
        return j;
      });
    });
  }

  /* ---------- رسانه و اتصال ---------- */
  function startMedia() {
    return navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: { echoCancellation: true, noiseSuppression: true } })
      .then(function (st) { localStream = st; $("localVideo").srcObject = st; $("placeholder").style.display = "none"; })
      .catch(function (e) { setMsg("دسترسی به دوربین یا میکروفن داده نشد. در تنظیمات مرورگر اجازه دهید و دوباره امتحان کنید."); throw e; });
  }

  function sendSignal(type, data) {
    sendChain = sendChain.then(function () {
      var body = JSON.stringify({ room: room, type: type, data: JSON.stringify(data) });
      var tryOnce = function (n) {
        return api("/visit/signal", { method: "POST", body: body }).catch(function (e) {
          console.error("signal send failed:", type, e);
          if (n < 3) return new Promise(function (r) { setTimeout(r, 700); }).then(function () { return tryOnce(n + 1); });
          setMsg("ارسال پیام اتصال به سرور ناموفق بود (" + (e.code || e.message) + "). اینترنت یا بک‌اند را بررسی کنید.");
        });
      };
      return tryOnce(0);
    });
    return sendChain;
  }

  function makePeer() {
    pc = new RTCPeerConnection({ iceServers: ICE });
    localStream.getTracks().forEach(function (t) { pc.addTrack(t, localStream); });
    pc.ontrack = function (e) {
      var v = $("remoteVideo"); v.srcObject = e.streams[0];
      var p = v.play(); if (p && p.catch) p.catch(function () {});
    };
    pc.onicecandidate = function (e) {
      if (!e.candidate) return;
      var t = e.candidate.type; if (cand[t] !== undefined) cand[t]++;
      sendSignal("candidate", e.candidate.toJSON());
    };
    pc.oniceconnectionstatechange = function () { console.log("ICE:", pc.iceConnectionState, JSON.stringify(cand)); };
    pc.onicecandidateerror = function (e) { console.warn("ICE candidate error", e.errorCode, e.url, e.errorText); };
    clearTimeout(connectTimer);
    connectTimer = setTimeout(function () {
      if (pc && pc.connectionState !== "connected") {
        setMsg("اتصال برقرار نشد. (candidates: host=" + cand.host + " srflx=" + cand.srflx + " relay=" + cand.relay + ") " +
          (cand.relay === 0 ? "هیچ candidate از نوع relay نیست؛ سرور TURN تنظیم نشده یا در دسترس نیست." : "اینترنت یکی از طرفین را عوض کنید یا بازخوانی کنید."));
      }
    }, 20000);
    pc.onconnectionstatechange = function () {
      var st = pc.connectionState;
      if (st === "connected") { connected = true; clearTimeout(pollTimer); clearTimeout(connectTimer); setStatus("جلسه برقرار است"); setMsg(""); }
      else if (st === "connecting") setStatus("در حال اتصال...");
      else if (st === "disconnected") setStatus("اتصال قطع شد");
      else if (st === "failed") { setStatus("اتصال برقرار نشد"); setMsg("اتصال مستقیم ممکن نشد. اینترنت را عوض کنید یا از تماس تلفنی استفاده کنید."); }
    };
  }

  function setupChannel(ch) {
    dc = ch;
    dc.onopen = function () { $("chatInput").disabled = false; $("sendBtn").disabled = false; addLog("گفتگوی متنی فعال شد", "sys"); };
    dc.onclose = function () { $("chatInput").disabled = true; $("sendBtn").disabled = true; };
    dc.onmessage = function (e) { addLog(e.data, "them"); };
  }

  function flushIce() { pendingIce.splice(0).forEach(function (c) { pc.addIceCandidate(c).catch(function () {}); }); }

  function handleSignal(s) {
    var d = JSON.parse(s.data);
    if (s.type === "offer" && role === "patient" && !pc) {
      makePeer();
      pc.ondatachannel = function (e) { setupChannel(e.channel); };
      return pc.setRemoteDescription(d).then(function () { return pc.createAnswer(); })
        .then(function (a) { return pc.setLocalDescription(a).then(function () { return sendSignal("answer", { type: a.type, sdp: a.sdp }); }); })
        .then(flushIce);
    }
    if (s.type === "answer" && role === "doctor" && pc && !pc.currentRemoteDescription) {
      return pc.setRemoteDescription(d).then(flushIce);
    }
    if (s.type === "candidate") {
      if (pc && pc.remoteDescription) pc.addIceCandidate(d).catch(function () {});
      else pendingIce.push(d);
    }
  }

  function poll() {
    if (!room || connected) return;
    api("/visit/signal?room=" + encodeURIComponent(room) + "&since=" + since).then(function (r) {
      var chain = (r.signals || []).reduce(function (p, s) {
        return p.then(function () { return handleSignal(s); }).catch(function (e) { console.error("handleSignal failed:", s && s.type, e); });
      }, Promise.resolve());
      return chain.then(function () { if (r.last > since) since = r.last; });
    }).catch(function (e) { console.error("poll failed:", e); }).then(function () {
      if (room && !connected) pollTimer = setTimeout(poll, pc ? 1000 : 3000);
    });
  }

  function enableCall() { ["micBtn", "camBtn", "hangBtn"].forEach(function (i) { $(i).disabled = false; }); $("joinBtn").disabled = true; }

  /* ---------- بیمار ---------- */
  function patientJoin() {
    setMsg(""); $("joinBtn").disabled = true;
    startMedia().then(function () { return api("/visit/join", { method: "POST", body: "{}" }); })
      .then(function (r) { room = r.room; since = r.since; side = "patient"; setStatus("در انتظار ورود دکتر..."); $("note").textContent = "تا ورود دکتر این صفحه را باز نگه دارید."; enableCall(); poll(); })
      .catch(function (e) { if (e && e.code) setMsg("ورود به اتاق انجام نشد. دوباره تلاش کنید."); $("joinBtn").disabled = false; });
  }

  /* ---------- دکتر ---------- */
  function loadQueue() {
    api("/visit/waiting").then(function (r) {
      var box = $("queueList"); box.textContent = "";
      if (!r.rooms.length) { box.textContent = "فعلاً کسی منتظر نیست."; return; }
      r.rooms.forEach(function (x) {
        var row = document.createElement("div"); row.className = "q-row";
        var nm = document.createElement("span"); nm.textContent = x.name;
        var b = document.createElement("button"); b.className = "btn primary"; b.textContent = "شروع ویزیت";
        b.onclick = function () { doctorPick(x.room); };
        row.appendChild(nm); row.appendChild(b); box.appendChild(row);
      });
    }).catch(function () {});
  }

  function doctorPick(r0) {
    setMsg(""); clearInterval(queueTimer); $("queue").style.display = "none";
    startMedia().then(function () { return api("/visit/pick", { method: "POST", body: JSON.stringify({ room: r0 }) }); })
      .then(function (r) {
        room = r.room; since = r.since; side = "doctor";
        makePeer(); setupChannel(pc.createDataChannel("chat")); enableCall(); setStatus("در حال اتصال...");
        return pc.createOffer().then(function (o) { return pc.setLocalDescription(o).then(function () { return sendSignal("offer", { type: o.type, sdp: o.sdp }); }); });
      }).then(function () { poll(); })
      .catch(function () { setMsg("این بیمار دیگر در انتظار نیست."); queueTimer = setInterval(loadQueue, 5000); $("queue").style.display = "block"; loadQueue(); });
  }

  /* ---------- پایان ---------- */
  function hangUp() {
    clearTimeout(pollTimer); clearInterval(queueTimer);
    var r = room; room = null;
    if (r) api("/visit/leave", { method: "POST", body: JSON.stringify({ room: r }) }).catch(function () {});
    if (dc) dc.close(); if (pc) pc.close();
    if (localStream) localStream.getTracks().forEach(function (t) { t.stop(); });
    $("remoteVideo").srcObject = null; $("localVideo").srcObject = null;
    setStatus("جلسه پایان یافت"); addLog("جلسه پایان یافت", "sys");
    ["micBtn", "camBtn", "hangBtn", "sendBtn", "chatInput"].forEach(function (i) { $(i).disabled = true; });
    $("placeholder").style.display = "flex"; $("placeholder").textContent = "جلسه تمام شد. برای جلسه جدید صفحه را دوباره باز کنید.";
  }

  function toggle(kind, btn, on, off) {
    var tr = kind === "audio" ? localStream.getAudioTracks() : localStream.getVideoTracks();
    var en = !tr[0].enabled; tr.forEach(function (t) { t.enabled = en; });
    btn.textContent = en ? on : off; btn.classList.toggle("off", !en);
  }

  function sendChat() {
    var v = $("chatInput").value.trim();
    if (!v || !dc || dc.readyState !== "open") return;
    dc.send(v); addLog(v, "me"); $("chatInput").value = "";
  }

  $("joinBtn").onclick = patientJoin;
  $("hangBtn").onclick = hangUp;
  $("micBtn").onclick = function () { toggle("audio", $("micBtn"), "قطع میکروفن", "وصل کردن میکروفن"); };
  $("camBtn").onclick = function () { toggle("video", $("camBtn"), "خاموش کردن دوربین", "روشن کردن دوربین"); };
  $("sendBtn").onclick = sendChat;
  $("chatInput").addEventListener("keydown", function (e) { if (e.key === "Enter") sendChat(); });
  window.addEventListener("beforeunload", function () {
    if (room && session && session.idToken) fetch("/api/visit/leave", { method: "POST", keepalive: true, headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.idToken }, body: JSON.stringify({ room: room }) });
  });

  /* ---------- شروع: نیاز به ورود به پنل ---------- */
  if (!session || !session.idToken) {
    $("joinBtn").style.display = "none";
    $("placeholder").innerHTML = "";
    var a = document.createElement("a"); a.href = "panel.html"; a.className = "btn primary"; a.style.pointerEvents = "auto"; a.style.textDecoration = "none"; a.textContent = "ورود به پنل کاربری";
    $("placeholder").appendChild(a); setStatus("ابتدا وارد حساب خود شوید");
  } else {
    api("/visit/me").then(function (r) {
      role = r.role;
      if (role === "doctor") {
        $("joinBtn").style.display = "none"; $("queue").style.display = "block";
        $("placeholder").textContent = "یکی از بیماران منتظر را انتخاب کنید.";
        loadQueue(); queueTimer = setInterval(loadQueue, 5000);
      }
    }).catch(function () { setMsg("نشست شما منقضی شده است. دوباره وارد پنل شوید."); $("joinBtn").disabled = true; });
  }
})();
</script>
</body>
</html>
