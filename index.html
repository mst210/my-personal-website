<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دکتر محمدصادق تاج</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Tahoma, Vazir, sans-serif;
            
            /* تنظیمات عکس پس‌زمینه */
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            
            /* انیمیشن ورود کارت */
            animation: fadeIn 1.2s ease-out forwards;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #ffffff;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.3s forwards;
        }
        p {
            color: #e2e8f0;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.6s forwards;
        }
        .heart-text {
            color: #ff4d6d;
            font-weight: bold;
            display: block;
            margin-top: 6px;
            direction: ltr;
            animation: pulse 1.5s infinite alternate;
        }
        .links a {
            display: block;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            margin-bottom: 12px;
            border-radius: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
        }
        .links a:nth-child(1) {
            animation: fadeInUp 0.8s ease-out 0.9s forwards;
        }
        .links a:nth-child(2) {
            animation: fadeInUp 0.8s ease-out 1.1s forwards;
        }
        .links a:hover {
            background: #ffffff;
            color: #0f172a;
            transform: translateY(-3px);
        }

        /* تعریف انیمیشن‌ها */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>دکتر محمدصادق تاج</h1>
        <p>
            به وب‌سایت شخصی من خوش آمدید.
            <span class="heart-text">My love is<br>♥️ Dr. Atena Chaab ♥️</span>
        </p>

        <div class="links">
            <a href="https://instagram.com/mst_2102" target="_blank">اینستاگرام</a>
            <a href="https://t.me/mst_2102" target="_blank">تلگرام</a>
        </div>
    </div>

</body>
</html>
