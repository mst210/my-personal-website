<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد | پنل ادمین</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="shared.css">

</head>

<body>

<div class="page-container">

    <div class="top-header">
        <div class="header-title">
            <h1>داشبورد مدیریت</h1>
            <p id="welcomeText">پنل مدیریت تجهیزات و محتوای پزشکی</p>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="logoutBtn" hidden><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
        </div>
    </div>

    <!-- Checking access -->
    <section id="loading" class="status-box">
        <i class="fa-solid fa-spinner fa-spin"></i>
        در حال بررسی دسترسی...
    </section>

    <!-- Not logged in -->
    <section id="loginSection" hidden>
        <div class="login-card">
            <h2>ورود مدیر</h2>
            <div class="form-error" id="loginError"></div>
            <form id="loginForm">
                <div class="field">
                    <label>ایمیل</label>
                    <input type="email" id="loginEmail" required autocomplete="username">
                </div>
                <div class="field">
                    <label>رمز عبور</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password">
                </div>
                <button type="submit" class="icon-btn btn-primary" style="width:100%;justify-content:center" id="loginSubmit">
                    ورود
                </button>
            </form>
        </div>
    </section>

    <!-- Logged in but not an admin -->
    <section id="deniedSection" hidden class="status-box error">
        <i class="fa-solid fa-lock"></i>
        <div id="deniedText">شما دسترسی مدیریت را ندارید.</div>
    </section>

    <!-- Main app -->
    <section id="app" hidden>

        <div class="nav-bar" id="navBar" hidden></div>

        <div class="stat-grid" id="statGrid"></div>

        <div class="section-card" id="usersSection" hidden>
            <h2><i class="fa-solid fa-users"></i> کاربران</h2>
            <div class="toolbar">
                <input class="field" style="margin:0" type="search" placeholder="جستجوی ایمیل یا شناسه..." id="userSearch">
                <div id="usersMeta" style="color:var(--text-muted);font-size:12.5px;"></div>
            </div>
            <div id="usersStatus" class="status-box" hidden></div>
            <div class="table-wrap">
                <table class="data-table" id="usersTable" hidden>
                    <thead>
                        <tr><th>کاربر</th><th>شناسه</th><th>ایمیل</th></tr>
                    </thead>
                    <tbody id="usersBody"></tbody>
                </table>
            </div>
        </div>

        <div class="section-card" id="ordersSection" hidden>
            <h2><i class="fa-solid fa-cart-shopping"></i> سفارش‌ها</h2>
            <div class="toolbar">
                <input class="field" style="margin:0" type="search" placeholder="جستجوی شناسه سفارش یا کاربر..." id="orderSearch">
                <div id="ordersMeta" style="color:var(--text-muted);font-size:12.5px;"></div>
            </div>
            <div id="ordersStatus" class="status-box" hidden></div>
            <div class="table-wrap">
                <table class="data-table" id="ordersTable" hidden>
                    <thead>
                        <tr><th>شناسه سفارش</th><th>کاربر</th><th>وضعیت</th></tr>
                    </thead>
                    <tbody id="ordersBody"></tbody>
                </table>
            </div>
        </div>

        <!-- TICKETS SECTION -->
        <div class="section-card" id="ticketsSection" hidden>
            <h2><i class="fa-solid fa-ticket"></i> تیکت‌های پشتیبانی کاربران</h2>
            <div class="toolbar">
                <input class="field" style="margin:0" type="search" placeholder="جستجو در موضوع یا نام کاربر..." id="ticketSearch">
                <div id="ticketsMeta" style="color:var(--text-muted);font-size:12.5px;"></div>
            </div>
            <div id="ticketsStatus" class="status-box" hidden></div>
            <div class="table-wrap">
                <table class="data-table" id="ticketsTable" hidden>
                    <thead>
                        <tr><th>موضوع</th><th>کاربر</th><th>وضعیت</th><th>تاریخ</th><th>عملیات</th></tr>
                    </thead>
                    <tbody id="ticketsBody"></tbody>
                </table>
            </div>
        </div>

    </section>

</div>

<!-- Ticket Chat Modal -->
<div class="modal-overlay" id="ticketModalOverlay" hidden>
    <div class="modal-box" style="max-width: 700px;">
        <div class="modal-head">
            <h3 id="ticketModalTitle">پاسخ به تیکت</h3>
            <button class="modal-close" id="ticketModalClose"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div style="margin-bottom: 15px; font-size: 13px; color: var(--text-muted);" id="ticketModalUserInfo"></div>

        <!-- Messages Thread -->
        <div id="adminChatMessages" style="display:flex; flex-direction:column; gap:12px; max-height:350px; overflow-y:auto; padding:10px; background:rgba(15,23,42,0.4); border-radius:12px; border:1px solid var(--border-color); margin-bottom:15px;"></div>

        <!-- Reply Form -->
        <form id="adminReplyForm" style="display:flex; gap:10px;">
            <input type="text" id="adminReplyText" class="field" style="margin:0; flex:1;" required placeholder="پاسخ خود را بنویسید...">
            <button type="submit" class="icon-btn btn-primary"><i class="fa-solid fa-paper-plane"></i> ارسال پاسخ</button>
        </form>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">

import {
    readSession, saveSession, apiFetch, friendlyError, showToast,
    escapeHtml, initials, renderNav
} from "./shared.js";

const el = (id) => document.getElementById(id);

const state = {
    permissions: [],
    isSuper: false,
    users: [],
    orders: [],
};

let allTickets = [];
let activeAdminTicket = null;

function can(section, action) {
    return state.permissions.includes(`${section}.${action}`);
}

const ORDER_STATUS_LABELS = {
    pending: "در انتظار",
    processing: "در حال پردازش",
    shipped: "ارسال‌شده",
    delivered: "تحویل‌شده",
    cancelled: "لغوشده",
};

function orderBadge(status) {
    const s = String(status || "").toLowerCase();
    const cls = s === "delivered" ? "success"
        : s === "cancelled" ? "danger"
        : s === "pending" ? "warn"
        : "";
    const label = ORDER_STATUS_LABELS[s] || status || "نامشخص";
    return `<span class="badge ${cls}">${escapeHtml(label)}</span>`;
}

function ticketBadge(status) {
    const map = {
        open: { label: "در انتظار پاسخ", cls: "warn" },
        answered: { label: "پاسخ داده شده", cls: "success" },
        closed: { label: "بسته شده", cls: "" }
    };
    const info = map[status] || { label: status, cls: "" };
    return `<span class="badge ${info.cls}">${escapeHtml(info.label)}</span>`;
}

function formatDateTime(value) {
    if (!value) return "—";
    try {
        return new Date(value).toLocaleString("fa-IR", {
            dateStyle: "short",
            timeStyle: "short"
        });
    } catch {
        return "—";
    }
}

/* =========================================================
   Boot / auth gate
========================================================= */

async function boot() {
    const session = readSession();

    if (!session?.idToken) {
        el("loading").hidden = true;
        el("loginSection").hidden = false;
        return;
    }

    try {
        const me = await apiFetch("/admin/me");
        state.permissions = me.permissions || [];
        state.isSuper = !!me.isSuper;

        el("welcomeText").textContent = me.name
            ? `خوش آمدید، ${me.name}`
            : (me.email || "پنل مدیریت تجهیزات و محتوای پزشکی");

        el("logoutBtn").hidden = false;
        el("loading").hidden = true;
        el("app").hidden = false;

        el("navBar").hidden = false;
        renderNav("dashboard", state.isSuper);
        renderStats(me);

        if (can("users", "view")) {
            el("usersSection").hidden = false;
            loadUsers();
        }

        if (can("orders", "view")) {
            el("ordersSection").hidden = false;
            loadOrders();
        }

        // Load tickets for admin / super admin
        if (can("tickets", "view") || state.isSuper || can("dashboard", "view")) {
            el("ticketsSection").hidden = false;
            loadTickets();
        }

        if (!can("users", "view") && !can("orders", "view") && !can("dashboard", "view")) {
            el("deniedText").textContent = "حساب شما به هیچ بخشی از داشبورد دسترسی ندارد.";
            el("deniedSection").hidden = false;
        }

    } catch (error) {
        el("loading").hidden = true;

        if (error.status === 401) {
            saveSession(null);
            el("loginSection").hidden = false;
            return;
        }

        el("deniedText").textContent = friendlyError(error);
        el("deniedSection").hidden = false;
        el("logoutBtn").hidden = false;
    }
}

el("logoutBtn").addEventListener("click", () => {
    saveSession(null);
    location.reload();
});

/* ---------- login ---------- */

el("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const errBox = el("loginError");
    errBox.classList.remove("show");

    const email = el("loginEmail").value.trim();
    const password = el("loginPassword").value;
    const btn = el("loginSubmit");

    btn.disabled = true;
    btn.textContent = "در حال ورود...";

    try {
        const result = await apiFetch("/auth/login", {
            method: "POST",
            body: JSON.stringify({ email, password }),
        }, false);

        saveSession({
            idToken: result.idToken,
            refreshToken: result.refreshToken,
            expiresIn: result.expiresIn,
            user: result.user,
        });

        location.reload();

    } catch (error) {
        errBox.textContent = friendlyError(error);
        errBox.classList.add("show");
    } finally {
        btn.disabled = false;
        btn.textContent = "ورود";
    }
});

/* =========================================================
   Stat cards
========================================================= */

async function renderStats(me) {
    const grid = el("statGrid");
    grid.innerHTML = "";

    const cards = [];

    if (can("dashboard", "view")) {
        cards.push({ icon: "fa-users", label: "تعداد کاربران", value: "…", id: "statUsers" });
        cards.push({ icon: "fa-cart-shopping", label: "تعداد سفارش‌ها", value: "…", id: "statOrders" });
    }

    cards.push({
        icon: state.isSuper ? "fa-crown" : "fa-user-shield",
        label: "سطح دسترسی شما",
        value: state.isSuper ? "مدیر ارشد" : (me.role ? roleLabel(me.role) : "—"),
        id: "statRole",
    });

    cards.push({
        icon: "fa-key",
        label: "تعداد دسترسی‌های فعال",
        value: state.permissions.length,
        id: "statPerms",
    });

    grid.innerHTML = cards.map((c) => `
        <div class="stat-card">
            <div class="icon"><i class="fa-solid ${c.icon}"></i></div>
            <div>
                <div class="num" id="${c.id}">${escapeHtml(String(c.value))}</div>
                <div class="label">${escapeHtml(c.label)}</div>
            </div>
        </div>
    `).join("");

    if (can("dashboard", "view")) {
        try {
            const stats = await apiFetch("/admin/stats");
            const usersEl = el("statUsers");
            const ordersEl = el("statOrders");
            if (usersEl) usersEl.textContent = stats.users ?? 0;
            if (ordersEl) ordersEl.textContent = stats.orders ?? 0;
        } catch (error) {
            console.error(error);
        }
    }
}

function roleLabel(role) {
    const labels = {
        super_admin: "مدیر ارشد",
        admin: "مدیر کل",
        content_manager: "مدیر محتوا",
        editor: "ویرایشگر",
    };
    return labels[role] || role;
}

/* =========================================================
   Users table
========================================================= */

async function loadUsers() {
    const status = el("usersStatus");
    const table = el("usersTable");

    status.hidden = false;
    status.className = "status-box";
    status.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال بارگذاری...';
    table.hidden = true;

    try {
        const result = await apiFetch("/admin/users");
        state.users = result.users || [];

        el("usersMeta").textContent = `${state.users.length} کاربر`;

        if (!state.users.length) {
            status.innerHTML = '<i class="fa-solid fa-inbox"></i> کاربری ثبت نشده است.';
            return;
        }

        status.hidden = true;
        table.hidden = false;
        renderUsers(state.users);

    } catch (error) {
        status.className = "status-box error";
        status.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${escapeHtml(friendlyError(error))}`;
    }
}

function renderUsers(list) {
    el("usersBody").innerHTML = list.map((u) => `
        <tr>
            <td>
                <div class="user-cell">
                    <div class="avatar">${initials(u.email || u.name || u.id)}</div>
                    <div class="name">${escapeHtml(u.name || "بدون نام")}</div>
                </div>
            </td>
            <td style="color:var(--text-muted);font-size:11.5px;">${escapeHtml(u.id)}</td>
            <td>${escapeHtml(u.email || "—")}</td>
        </tr>
    `).join("");
}

el("userSearch").addEventListener("input", () => {
    const q = el("userSearch").value.trim().toLowerCase();
    const filtered = !q ? state.users : state.users.filter((u) =>
        String(u.email || "").toLowerCase().includes(q) ||
        String(u.id || "").toLowerCase().includes(q) ||
        String(u.name || "").toLowerCase().includes(q)
    );
    renderUsers(filtered);
    el("usersMeta").textContent = `${filtered.length} از ${state.users.length} کاربر`;
});

/* =========================================================
   Orders table
========================================================= */

async function loadOrders() {
    const status = el("ordersStatus");
    const table = el("ordersTable");

    status.hidden = false;
    status.className = "status-box";
    status.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال بارگذاری...';
    table.hidden = true;

    try {
        const result = await apiFetch("/admin/orders");
        state.orders = result.orders || [];

        el("ordersMeta").textContent = `${state.orders.length} سفارش`;

        if (!state.orders.length) {
            status.innerHTML = '<i class="fa-solid fa-inbox"></i> سفارشی ثبت نشده است.';
            return;
        }

        status.hidden = true;
        table.hidden = false;
        renderOrders(state.orders);

    } catch (error) {
        status.className = "status-box error";
        status.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${escapeHtml(friendlyError(error))}`;
    }
}

function renderOrders(list) {
    el("ordersBody").innerHTML = list.map((o) => `
        <tr>
            <td style="font-weight:600;">${escapeHtml(o.id)}</td>
            <td style="color:var(--text-muted);font-size:11.5px;">${escapeHtml(o.userId || "—")}</td>
            <td>${orderBadge(o.status)}</td>
        </tr>
    `).join("");
}

el("orderSearch").addEventListener("input", () => {
    const q = el("orderSearch").value.trim().toLowerCase();
    const filtered = !q ? state.orders : state.orders.filter((o) =>
        String(o.id || "").toLowerCase().includes(q) ||
        String(o.userId || "").toLowerCase().includes(q)
    );
    renderOrders(filtered);
    el("ordersMeta").textContent = `${filtered.length} از ${state.orders.length} سفارش`;
});

/* =========================================================
   Tickets table & chat management
========================================================= */

async function loadTickets() {
    const status = el("ticketsStatus");
    const table = el("ticketsTable");

    status.hidden = false;
    status.className = "status-box";
    status.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال بارگذاری تیکت‌ها...';
    table.hidden = true;

    try {
        if (!state.users || !state.users.length) {
            const userRes = await apiFetch("/admin/users");
            state.users = userRes.users || [];
        }

        allTickets = [];
        for (const user of state.users) {
            try {
                const res = await apiFetch(`/firestore?path=${encodeURIComponent(`users/${user.id}/tickets`)}`);
                const docs = res.documents || [];
                docs.forEach(docSnap => {
                    allTickets.push({
                        userId: user.id,
                        userEmail: user.email || user.id,
                        userName: user.name || "کاربر",
                        id: docSnap.id,
                        ...docSnap.data
                    });
                });
            } catch (e) {
                // User has no tickets subcollection
            }
        }

        allTickets.sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));

        el("ticketsMeta").textContent = `${allTickets.length} تیکت`;

        if (!allTickets.length) {
            status.innerHTML = '<i class="fa-solid fa-inbox"></i> تیکتی ثبت نشده است.';
            return;
        }

        status.hidden = true;
        table.hidden = false;
        renderTickets(allTickets);

    } catch (error) {
        status.className = "status-box error";
        status.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${escapeHtml(friendlyError(error))}`;
    }
}

function renderTickets(list) {
    el("ticketsBody").innerHTML = list.map((t) => `
        <tr>
            <td style="font-weight:600;">${escapeHtml(t.subject || "بدون موضوع")}</td>
            <td>
                <div style="font-weight:600;">${escapeHtml(t.userName)}</div>
                <div style="color:var(--text-muted);font-size:11.5px;">${escapeHtml(t.userEmail)}</div>
            </td>
            <td>${ticketBadge(t.status)}</td>
            <td style="color:var(--text-muted);font-size:11.5px;">${formatDateTime(t.createdAt)}</td>
            <td>
                <button class="icon-btn btn-primary" onclick="openAdminTicketChat('${t.userId}', '${t.id}')">
                    <i class="fa-solid fa-comments"></i> بررسی و پاسخ
                </button>
            </td>
        </tr>
    `).join("");
}

el("ticketSearch").addEventListener("input", () => {
    const q = el("ticketSearch").value.trim().toLowerCase();
    const filtered = !q ? allTickets : allTickets.filter((t) =>
        String(t.subject || "").toLowerCase().includes(q) ||
        String(t.userName || "").toLowerCase().includes(q) ||
        String(t.userEmail || "").toLowerCase().includes(q)
    );
    renderTickets(filtered);
    el("ticketsMeta").textContent = `${filtered.length} از ${allTickets.length} تیکت`;
});

window.openAdminTicketChat = function(userId, ticketId) {
    const ticket = allTickets.find(t => t.userId === userId && t.id === ticketId);
    if (!ticket) return;
    activeAdminTicket = ticket;

    el("ticketModalTitle").textContent = ticket.subject || "جزئیات تیکت";
    el("ticketModalUserInfo").textContent = `کاربر: ${ticket.userName} (${ticket.userEmail}) — ثبت شده در: ${formatDateTime(ticket.createdAt)}`;
    
    renderAdminChatMessages();
    el("ticketModalOverlay").hidden = false;
};

function renderAdminChatMessages() {
    const container = el("adminChatMessages");
    const messages = Array.isArray(activeAdminTicket.messages) ? activeAdminTicket.messages : [];

    container.innerHTML = messages.map(msg => {
        const isAdmin = msg.sender === "admin";
        const bg = isAdmin ? "rgba(20, 184, 166, 0.15)" : "rgba(2, 132, 199, 0.2)";
        const border = isAdmin ? "rgba(20, 184, 166, 0.3)" : "rgba(56, 189, 248, 0.3)";
        const align = isAdmin ? "margin-left:auto;" : "margin-right:auto;";
        const senderLabel = isAdmin ? "پشتیبانی (شما)" : "کاربر";
        const color = isAdmin ? "#5eead4" : "#38bdf8";

        return `
            <div style="background:${bg}; border:1px solid ${border}; border-radius:12px; padding:10px 14px; max-width:80%; ${align}">
                <div style="font-weight:700; font-size:11px; margin-bottom:4px; color:${color};">${senderLabel}</div>
                <div style="font-size:13px; line-height:1.8; color:var(--text-main);">${escapeHtml(msg.text)}</div>
                <div style="font-size:10px; color:var(--text-muted); margin-top:4px; text-align:left;">${formatDateTime(msg.timestamp)}</div>
            </div>
        `;
    }).join("");

    container.scrollTop = container.scrollHeight;
}

el("ticketModalClose").addEventListener("click", () => {
    el("ticketModalOverlay").hidden = true;
    activeAdmin = null;
});

el("adminReplyForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!activeAdminTicket) return;

    const input = el("adminReplyText");
    const text = input.value.trim();
    if (!text) return;

    const nowIso = new Date().toISOString();
    const messages = Array.isArray(activeAdminTicket.messages) ? [...activeAdminTicket.messages] : [];

    messages.push({
        sender: "admin",
        text: text,
        timestamp: nowIso
    });

    const updatedData = {
        ...activeAdminTicket,
        status: "answered",
        updatedAt: nowIso,
        messages: messages
    };
    delete updatedData.userId;
    delete updatedData.userEmail;
    delete updatedData.userName;

    try {
        await apiFetch(`/firestore?path=${encodeURIComponent(`users/${activeAdminTicket.userId}/tickets/${activeAdminTicket.id}`)}`, {
            method: "PUT",
            body: JSON.stringify({ data: updatedData })
        });

        activeAdminTicket.messages = messages;
        activeAdminTicket.status = "answered";
        activeAdminTicket.updatedAt = nowIso;

        input.value = "";
        renderAdminChatMessages();
        renderTickets(allTickets);
        showToast("پاسخ شما با موفقیت ارسال شد.");
    } catch (err) {
        showToast(friendlyError(err), "error");
    }
});

boot();

</script>

</body>
</html>
