<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت محتوا | پنل ادمین</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

    :root {
        --primary-blue: #0284c7;
        --accent-teal: #14b8a6;
        --dark-bg: #0f172a;
        --card-bg: rgba(255, 255, 255, 0.05);
        --card-bg-strong: rgba(255, 255, 255, 0.08);
        --border-color: rgba(255, 255, 255, 0.1);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --danger: #ef4444;
        --success: #22c55e;
        --warn: #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: "Vazirmatn", sans-serif;
        color: var(--text-main);
        background:
            radial-gradient(circle at top right, rgba(2, 132, 199, .22), transparent 35%),
            radial-gradient(circle at bottom left, rgba(20, 184, 166, .14), transparent 35%),
            var(--dark-bg);
    }

    button, input, select, textarea { font-family: inherit; }
    a { text-decoration: none; color: inherit; }

    .page-container {
        width: min(1100px, 94%);
        margin: 0 auto;
        padding: 25px 0 60px;
    }

    /* ---------- header ---------- */

    .top-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 22px;
        padding: 18px 22px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        backdrop-filter: blur(15px);
    }

    .header-title h1 { margin: 0 0 5px; font-size: 21px; }
    .header-title p { margin: 0; color: var(--text-muted); font-size: 13px; }

    .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid var(--border-color);
        background: rgba(255, 255, 255, .06);
        color: var(--text-main);
        padding: 10px 16px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 13px;
        transition: background .15s;
    }

    .icon-btn:hover { background: rgba(255, 255, 255, .12); }

    .btn-primary {
        background: linear-gradient(135deg, var(--primary-blue), var(--accent-teal));
        border: none;
        color: #fff;
        font-weight: 600;
    }

    .btn-primary:hover { filter: brightness(1.08); }

    .btn-danger { border-color: rgba(239, 68, 68, .4); color: #fecaca; }
    .btn-danger:hover { background: rgba(239, 68, 68, .18); }

    .btn-warn { border-color: rgba(245, 158, 11, .4); color: #fde68a; }
    .btn-warn:hover { background: rgba(245, 158, 11, .18); }

    .icon-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ---------- status sections ---------- */

    .status-box {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-muted);
    }

    .status-box i { font-size: 34px; margin-bottom: 14px; display: block; color: var(--accent-teal); }
    .status-box.error i { color: var(--danger); }

    /* ---------- login form ---------- */

    .login-card {
        max-width: 380px;
        margin: 40px auto;
        padding: 28px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        backdrop-filter: blur(15px);
    }

    .login-card h2 { margin: 0 0 20px; font-size: 18px; text-align: center; }

    .field { margin-bottom: 14px; }

    .field label {
        display: block;
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: 6px;
    }

    .field input,
    .field textarea,
    .field select {
        width: 100%;
        padding: 11px 13px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
        background: rgba(255, 255, 255, .04);
        color: var(--text-main);
        font-size: 14px;
        outline: none;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus { border-color: var(--primary-blue); }

    .field textarea { resize: vertical; min-height: 90px; line-height: 1.9; }
    .field .hint { font-size: 11.5px; color: var(--text-muted); margin-top: 5px; }

    .form-error {
        background: rgba(239, 68, 68, .12);
        border: 1px solid rgba(239, 68, 68, .35);
        color: #fecaca;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 13px;
        margin-bottom: 14px;
        display: none;
    }

    .form-error.show { display: block; }

    /* ---------- tabs ---------- */

    .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
        flex-wrap: wrap;
    }

    .tab-btn {
        padding: 10px 18px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background: rgba(255, 255, 255, .04);
        color: var(--text-muted);
        cursor: pointer;
        font-size: 13.5px;
        font-weight: 600;
    }

    .tab-btn.active {
        background: linear-gradient(135deg, var(--primary-blue), var(--accent-teal));
        color: #fff;
        border-color: transparent;
    }

    .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
    }

    /* ---------- post list ---------- */

    .post-list { display: flex; flex-direction: column; gap: 12px; }

    .post-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 16px 18px;
        display: flex;
        gap: 14px;
        align-items: flex-start;
        flex-wrap: wrap;
    }

    .post-card-main { flex: 1 1 260px; min-width: 0; }

    .post-card-head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 6px;
    }

    .badge {
        font-size: 11px;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        white-space: nowrap;
    }

    .badge.published { color: #86efac; border-color: rgba(34, 197, 94, .35); background: rgba(34, 197, 94, .1); }
    .badge.draft { color: #fcd34d; border-color: rgba(245, 158, 11, .35); background: rgba(245, 158, 11, .1); }

    .post-card-title { font-size: 15.5px; font-weight: 700; margin: 0 0 4px; }
    .post-card-meta { font-size: 12px; color: var(--text-muted); }
    .post-card-summary { font-size: 13px; color: var(--text-muted); margin-top: 8px; line-height: 1.8; }

    .post-card-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .post-card-actions .icon-btn { padding: 8px 12px; font-size: 12.5px; }

    /* ---------- modal ---------- */

    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .55);
        backdrop-filter: blur(3px);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 30px 16px;
        overflow-y: auto;
        z-index: 50;
    }

    .modal-box {
        width: min(640px, 100%);
        background: #111c34;
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 24px;
    }

    .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
    }

    .modal-head h3 { margin: 0; font-size: 17px; }

    .modal-close {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 18px;
        cursor: pointer;
    }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    @media (max-width: 560px) { .row-2 { grid-template-columns: 1fr; } }

    .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 6px;
    }

    .img-preview {
        margin-top: 8px;
        max-width: 100%;
        max-height: 140px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
        display: none;
    }

    /* ---------- toast ---------- */

    .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: #111c34;
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 13px 20px;
        font-size: 13.5px;
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s, transform .2s;
        z-index: 100;
        max-width: 90%;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: rgba(34, 197, 94, .4); }
    .toast.error { border-color: rgba(239, 68, 68, .4); }

    [hidden] { display: none !important; }

</style>
</head>

<body>

<div class="page-container">

    <div class="top-header">
        <div class="header-title">
            <h1>مدیریت محتوا</h1>
            <p>اخبار و مطالب پزشکی سایت</p>
        </div>
        <div class="header-actions">
            <a class="icon-btn" href="index.html"><i class="fa-solid fa-gauge"></i> داشبورد</a>
            <button class="icon-btn" id="logoutBtn" hidden><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
        </div>
    </div>

    <!-- Checking access -->
    <section id="loading" class="status-box">
        <i class="fa-solid fa-spinner fa-spin"></i>
        در حال بررسی دسترسی...
    </section>

    <!-- Not logged in -->
    <section id="loginSection" hidden>
        <div class="login-card">
            <h2>ورود مدیر</h2>
            <div class="form-error" id="loginError"></div>
            <form id="loginForm">
                <div class="field">
                    <label>ایمیل</label>
                    <input type="email" id="loginEmail" required autocomplete="username">
                </div>
                <div class="field">
                    <label>رمز عبور</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password">
                </div>
                <button type="submit" class="icon-btn btn-primary" style="width:100%;justify-content:center" id="loginSubmit">
                    ورود
                </button>
            </form>
        </div>
    </section>

    <!-- Logged in but not an admin / no relevant permission -->
    <section id="deniedSection" hidden class="status-box error">
        <i class="fa-solid fa-lock"></i>
        <div id="deniedText">شما دسترسی مدیریت محتوا را ندارید.</div>
    </section>

    <!-- Main app -->
    <section id="app" hidden>

        <div class="tabs" id="tabs"></div>

        <div class="toolbar">
            <div id="listMeta" style="color:var(--text-muted);font-size:13px;"></div>
            <button class="icon-btn btn-primary" id="addBtn" hidden>
                <i class="fa-solid fa-plus"></i> افزودن مطلب جدید
            </button>
        </div>

        <div id="listStatus" class="status-box" hidden></div>
        <div class="post-list" id="postList"></div>

    </section>

</div>

<!-- Add/Edit modal -->
<div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal-box">
        <div class="modal-head">
            <h3 id="modalTitle">افزودن مطلب</h3>
            <button class="modal-close" id="modalClose"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="form-error" id="formError"></div>

        <form id="postForm">
            <div class="field">
                <label>عنوان *</label>
                <input type="text" id="fTitle" maxlength="200" required>
            </div>

            <div class="row-2">
                <div class="field">
                    <label>دسته‌بندی</label>
                    <input type="text" id="fCategory" maxlength="100">
                </div>
                <div class="field">
                    <label>وضعیت انتشار</label>
                    <select id="fStatus">
                        <option value="draft">پیش‌نویس</option>
                        <option value="published">منتشرشده</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label>خلاصه</label>
                <textarea id="fSummary" maxlength="500" style="min-height:60px"></textarea>
            </div>

            <div class="field">
                <label>متن کامل *</label>
                <textarea id="fBody" maxlength="20000" required></textarea>
                <div class="hint">فقط متن ساده — پاراگراف‌ها را با یک خط خالی از هم جدا کنید (بدون HTML).</div>
            </div>

            <div class="field">
                <label>آدرس تصویر (اختیاری)</label>
                <input type="url" id="fImageUrl" placeholder="https://...">
                <div class="hint">فقط لینک‌های https:// پذیرفته می‌شود.</div>
                <img id="fImagePreview" class="img-preview">
            </div>

            <div class="modal-actions">
                <button type="button" class="icon-btn" id="cancelBtn">انصراف</button>
                <button type="submit" class="icon-btn btn-primary" id="submitBtn">ذخیره</button>
            </div>
        </form>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">

/* =========================================================
   Session (shared with panel.html / admin/admin.js)
========================================================= */

const API_BASE = "/api";
const AUTH_STORAGE_KEY = "taj_medical_proxy_auth_v1";

function readSession() {
    try {
        const raw = localStorage.getItem(AUTH_STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
    } catch {
        return null;
    }
}

function saveSession(session) {
    if (!session) {
        localStorage.removeItem(AUTH_STORAGE_KEY);
        return;
    }
    localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(session));
}

async function apiFetch(path, options = {}, retry = true) {
    const session = readSession();
    const headers = new Headers(options.headers || {});

    if (options.body && !headers.has("Content-Type")) {
        headers.set("Content-Type", "application/json");
    }

    if (session?.idToken) {
        headers.set("Authorization", `Bearer ${session.idToken}`);
    }

    const response = await fetch(API_BASE + path, { ...options, headers });

    if (response.status === 401 && retry && session?.refreshToken) {
        try {
            const refreshResponse = await fetch(`${API_BASE}/auth/refresh`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ refreshToken: session.refreshToken })
            });

            if (refreshResponse.ok) {
                const refreshed = await refreshResponse.json();

                saveSession({
                    ...session,
                    idToken: refreshed.idToken,
                    refreshToken: refreshed.refreshToken || session.refreshToken,
                    expiresIn: refreshed.expiresIn
                });

                return apiFetch(path, options, false);
            }
        } catch (e) {
            console.error("refresh failed", e);
        }
    }

    let payload = null;
    try { payload = await response.json(); } catch { payload = null; }

    if (!response.ok) {
        const error = new Error(payload?.message || payload?.error || `HTTP ${response.status}`);
        error.code = payload?.error || payload?.code || `http/${response.status}`;
        error.status = response.status;
        throw error;
    }

    return payload;
}

/* =========================================================
   UI helpers
========================================================= */

const ERROR_MESSAGES = {
    INVALID_LOGIN_CREDENTIALS: "ایمیل یا رمز عبور اشتباه است.",
    NOT_ADMIN: "شما دسترسی مدیریت ندارید.",
    ACCOUNT_DISABLED: "حساب مدیریتی شما غیرفعال شده است.",
    FORBIDDEN: "مجوز لازم برای این عملیات را ندارید.",
    MISSING_FIELDS: "لطفاً فیلدهای الزامی را پر کنید.",
    INVALID_IMAGE_URL: "آدرس تصویر باید با https:// شروع شود.",
    UNAUTHENTICATED: "لطفاً دوباره وارد شوید.",
    NOT_FOUND: "مورد موردنظر یافت نشد.",
};

function friendlyError(error) {
    return ERROR_MESSAGES[error.code] || error.message || "خطایی رخ داد.";
}

function showToast(message, type = "success") {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.className = "toast show " + type;
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), 3200);
}

function formatDate(value) {
    if (!value) return "—";
    try {
        return new Date(value).toLocaleDateString("fa-IR", {
            year: "numeric", month: "long", day: "numeric"
        });
    } catch {
        return "—";
    }
}

function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = String(value ?? "");
    return div.innerHTML;
}

/* =========================================================
   State
========================================================= */

const state = {
    permissions: [],
    tabs: [],          // [{ type, label, section }]
    activeType: null,
    posts: [],
    editingId: null,
};

const TAB_DEFS = [
    { type: "news", section: "news", label: "اخبار" },
    { type: "article", section: "articles", label: "مطالب پزشکی" },
];

function can(section, action) {
    return state.permissions.includes(`${section}.${action}`);
}

/* =========================================================
   Boot / auth gate
========================================================= */

const el = (id) => document.getElementById(id);

async function boot() {
    const session = readSession();

    if (!session?.idToken) {
        el("loading").hidden = true;
        el("loginSection").hidden = false;
        return;
    }

    try {
        const me = await apiFetch("/admin/me");
        state.permissions = me.permissions || [];

        state.tabs = TAB_DEFS.filter((t) => can(t.section, "view"));

        if (!state.tabs.length) {
            el("loading").hidden = true;
            el("deniedText").textContent = "حساب شما به بخش اخبار یا مطالب پزشکی دسترسی ندارد.";
            el("deniedSection").hidden = false;
            el("logoutBtn").hidden = false;
            return;
        }

        el("logoutBtn").hidden = false;
        el("loading").hidden = true;
        el("app").hidden = false;

        renderTabs();
        activateTab(state.tabs[0].type);

    } catch (error) {
        el("loading").hidden = true;

        if (error.status === 401) {
            saveSession(null);
            el("loginSection").hidden = false;
            return;
        }

        el("deniedText").textContent = friendlyError(error);
        el("deniedSection").hidden = false;
        el("logoutBtn").hidden = false;
    }
}

el("logoutBtn").addEventListener("click", () => {
    saveSession(null);
    location.reload();
});

/* ---------- login ---------- */

el("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const errBox = el("loginError");
    errBox.classList.remove("show");

    const email = el("loginEmail").value.trim();
    const password = el("loginPassword").value;
    const btn = el("loginSubmit");

    btn.disabled = true;
    btn.textContent = "در حال ورود...";

    try {
        const result = await apiFetch("/auth/login", {
            method: "POST",
            body: JSON.stringify({ email, password }),
        }, false);

        saveSession({
            idToken: result.idToken,
            refreshToken: result.refreshToken,
            expiresIn: result.expiresIn,
            user: result.user,
        });

        location.reload();

    } catch (error) {
        errBox.textContent = friendlyError(error);
        errBox.classList.add("show");
    } finally {
        btn.disabled = false;
        btn.textContent = "ورود";
    }
});

/* =========================================================
   Tabs
========================================================= */

function renderTabs() {
    const wrap = el("tabs");
    wrap.innerHTML = "";

    for (const tab of state.tabs) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab-btn";
        btn.textContent = tab.label;
        btn.dataset.type = tab.type;
        btn.addEventListener("click", () => activateTab(tab.type));
        wrap.appendChild(btn);
    }
}

function currentTab() {
    return state.tabs.find((t) => t.type === state.activeType);
}

async function activateTab(type) {
    state.activeType = type;

    for (const btn of el("tabs").querySelectorAll(".tab-btn")) {
        btn.classList.toggle("active", btn.dataset.type === type);
    }

    const tab = currentTab();
    el("addBtn").hidden = !can(tab.section, "add");

    await loadPosts();
}

/* =========================================================
   Load / render list
========================================================= */

async function loadPosts() {
    const listStatus = el("listStatus");
    const listMeta = el("listMeta");
    const list = el("postList");

    list.innerHTML = "";
    listStatus.hidden = false;
    listStatus.className = "status-box";
    listStatus.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال بارگذاری...';
    listMeta.textContent = "";

    try {
        const result = await apiFetch(`/admin/posts?type=${encodeURIComponent(state.activeType)}`);
        state.posts = result.posts || [];

        listStatus.hidden = true;
        listMeta.textContent = `${state.posts.length} مطلب`;

        if (!state.posts.length) {
            listStatus.hidden = false;
            listStatus.innerHTML = '<i class="fa-solid fa-inbox"></i> هنوز مطلبی ثبت نشده است.';
            return;
        }

        renderPosts();

    } catch (error) {
        listStatus.className = "status-box error";
        listStatus.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${escapeHtml(friendlyError(error))}`;
    }
}

function renderPosts() {
    const tab = currentTab();
    const list = el("postList");
    list.innerHTML = "";

    for (const post of state.posts) {
        const card = document.createElement("div");
        card.className = "post-card";

        const statusBadge = post.status === "published"
            ? `<span class="badge published">منتشرشده</span>`
            : `<span class="badge draft">پیش‌نویس</span>`;

        const categoryBadge = post.category
            ? `<span class="badge">${escapeHtml(post.category)}</span>`
            : "";

        card.innerHTML = `
            <div class="post-card-main">
                <div class="post-card-head">
                    ${statusBadge}
                    ${categoryBadge}
                </div>
                <h3 class="post-card-title">${escapeHtml(post.title)}</h3>
                <div class="post-card-meta">ایجاد: ${formatDate(post.createdAt)}${post.publishedAt ? " · انتشار: " + formatDate(post.publishedAt) : ""}</div>
                ${post.summary ? `<div class="post-card-summary">${escapeHtml(post.summary)}</div>` : ""}
            </div>
            <div class="post-card-actions"></div>
        `;

        const actions = card.querySelector(".post-card-actions");

        if (can(tab.section, "edit")) {
            const editBtn = document.createElement("button");
            editBtn.className = "icon-btn";
            editBtn.innerHTML = '<i class="fa-solid fa-pen"></i> ویرایش';
            editBtn.addEventListener("click", () => openForm(post));
            actions.appendChild(editBtn);
        }

        if (can(tab.section, "publish")) {
            const toggleBtn = document.createElement("button");
            const publishing = post.status !== "published";
            toggleBtn.className = "icon-btn " + (publishing ? "" : "btn-warn");
            toggleBtn.innerHTML = publishing
                ? '<i class="fa-solid fa-upload"></i> انتشار'
                : '<i class="fa-solid fa-rotate-left"></i> بازگردانی به پیش‌نویس';
            toggleBtn.addEventListener("click", () => toggleStatus(post, publishing));
            actions.appendChild(toggleBtn);
        }

        if (can(tab.section, "delete")) {
            const delBtn = document.createElement("button");
            delBtn.className = "icon-btn btn-danger";
            delBtn.innerHTML = '<i class="fa-solid fa-trash"></i> حذف';
            delBtn.addEventListener("click", () => deletePost(post));
            actions.appendChild(delBtn);
        }

        list.appendChild(card);
    }
}

/* =========================================================
   Publish toggle / delete
========================================================= */

async function toggleStatus(post, publishing) {
    try {
        await apiFetch(`/admin/posts/${encodeURIComponent(post.id)}`, {
            method: "PUT",
            body: JSON.stringify({ status: publishing ? "published" : "draft" }),
        });

        showToast(publishing ? "مطلب منتشر شد." : "مطلب به پیش‌نویس بازگردانده شد.");
        await loadPosts();

    } catch (error) {
        showToast(friendlyError(error), "error");
    }
}

async function deletePost(post) {
    if (!confirm(`مطلب «${post.title}» حذف شود؟ این کار قابل بازگشت نیست.`)) return;

    try {
        await apiFetch(`/admin/posts/${encodeURIComponent(post.id)}`, { method: "DELETE" });
        showToast("مطلب حذف شد.");
        await loadPosts();
    } catch (error) {
        showToast(friendlyError(error), "error");
    }
}

/* =========================================================
   Add / edit form
========================================================= */

el("addBtn").addEventListener("click", () => openForm(null));
el("modalClose").addEventListener("click", closeForm);
el("cancelBtn").addEventListener("click", closeForm);

el("fImageUrl").addEventListener("input", () => {
    const url = el("fImageUrl").value.trim();
    const preview = el("fImagePreview");

    if (/^https:\/\//i.test(url)) {
        preview.src = url;
        preview.style.display = "block";
        preview.onerror = () => { preview.style.display = "none"; };
    } else {
        preview.style.display = "none";
    }
});

function openForm(post) {
    const tab = currentTab();
    state.editingId = post ? post.id : null;

    el("modalTitle").textContent = post ? "ویرایش مطلب" : "افزودن مطلب";
    el("formError").classList.remove("show");

    el("fTitle").value = post?.title || "";
    el("fCategory").value = post?.category || "";
    el("fSummary").value = post?.summary || "";
    el("fBody").value = post?.body || "";
    el("fImageUrl").value = post?.imageUrl || "";

    const preview = el("fImagePreview");
    if (post?.imageUrl) {
        preview.src = post.imageUrl;
        preview.style.display = "block";
    } else {
        preview.style.display = "none";
    }

    const statusField = el("fStatus");
    const canPublish = can(tab.section, "publish");

    if (canPublish) {
        statusField.disabled = false;
        statusField.value = post?.status || "draft";
    } else {
        statusField.disabled = true;
        statusField.value = "draft";
    }

    el("modalOverlay").hidden = false;
    el("fTitle").focus();
}

function closeForm() {
    el("modalOverlay").hidden = true;
}

el("postForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const tab = currentTab();
    const errBox = el("formError");
    errBox.classList.remove("show");

    const title = el("fTitle").value.trim();
    const body = el("fBody").value.trim();
    const imageUrl = el("fImageUrl").value.trim();

    if (!title || !body) {
        errBox.textContent = "عنوان و متن کامل الزامی هستند.";
        errBox.classList.add("show");
        return;
    }

    if (imageUrl && !/^https:\/\//i.test(imageUrl)) {
        errBox.textContent = "آدرس تصویر باید با https:// شروع شود.";
        errBox.classList.add("show");
        return;
    }

    const payload = {
        title,
        category: el("fCategory").value.trim(),
        summary: el("fSummary").value.trim(),
        body,
        imageUrl: imageUrl || null,
    };

    if (can(tab.section, "publish")) {
        payload.status = el("fStatus").value;
    }

    const submitBtn = el("submitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "در حال ذخیره...";

    try {
        if (state.editingId) {
            await apiFetch(`/admin/posts/${encodeURIComponent(state.editingId)}`, {
                method: "PUT",
                body: JSON.stringify(payload),
            });
            showToast("مطلب به‌روزرسانی شد.");
        } else {
            await apiFetch("/admin/posts", {
                method: "POST",
                body: JSON.stringify({ type: state.activeType, ...payload }),
            });
            showToast("مطلب افزوده شد.");
        }

        closeForm();
        await loadPosts();

    } catch (error) {
        errBox.textContent = friendlyError(error);
        errBox.classList.add("show");
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "ذخیره";
    }
});

boot();

</script>

</html>
