<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متن‌های سایت | پنل ادمین</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="shared.css">

<style>

    .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }

    .tab-btn {
        padding: 10px 18px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background: rgba(255, 255, 255, .04);
        color: var(--text-muted);
        cursor: pointer;
        font-size: 13.5px;
        font-weight: 600;
    }

    .tab-btn.active {
        background: linear-gradient(135deg, var(--primary-blue), var(--accent-teal));
        color: #fff;
        border-color: transparent;
    }

    .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
    }

    .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: #111c34;
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 13px 20px;
        font-size: 13.5px;
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s, transform .2s;
        z-index: 100;
        max-width: 90%;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: rgba(34, 197, 94, .4); }
    .toast.error { border-color: rgba(239, 68, 68, .4); }

    [hidden] { display: none !important; }

</style>
</head>

<body>

<div class="page-container">

    <div class="top-header">
        <div class="header-title">
            <h1>متن‌های سایت</h1>
            <p>ویرایش متن‌ها و بخش‌های ثابت صفحات سایت</p>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="logoutBtn" hidden><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
        </div>
    </div>

    <div class="nav-bar" id="navBar" hidden></div>

    <!-- Checking access -->
    <section id="loading" class="status-box">
        <i class="fa-solid fa-spinner fa-spin"></i>
        در حال بررسی دسترسی...
    </section>

    <!-- Not logged in -->
    <section id="loginSection" hidden>
        <div class="login-card">
            <h2>ورود مدیر</h2>
            <div class="form-error" id="loginError"></div>
            <form id="loginForm">
                <div class="field">
                    <label>ایمیل</label>
                    <input type="email" id="loginEmail" required autocomplete="username">
                </div>
                <div class="field">
                    <label>رمز عبور</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password">
                </div>
                <button type="submit" class="icon-btn btn-primary" style="width:100%;justify-content:center" id="loginSubmit">
                    ورود
                </button>
            </form>
        </div>
    </section>

    <!-- Logged in but no pages permission -->
    <section id="deniedSection" hidden class="status-box error">
        <i class="fa-solid fa-lock"></i>
        <div id="deniedText">شما دسترسی ویرایش متن‌های سایت را ندارید.</div>
    </section>

    <!-- Main app -->
    <section id="app" hidden>

        <div class="tabs" id="tabs"></div>

        <div class="toolbar">
            <div id="pageMeta" style="color:var(--text-muted);font-size:13px;"></div>
        </div>

        <div id="pageStatus" class="status-box" hidden></div>

        <form id="pageForm">
            <div id="fieldsContainer"></div>

            <div class="modal-actions" style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;">
                <button type="submit" class="icon-btn btn-primary" id="submitBtn" hidden>
                    <i class="fa-solid fa-floppy-disk"></i> ذخیره تغییرات
                </button>
            </div>
        </form>

    </section>

</div>

<div class="toast" id="toast"></div>

<script type="module">

import {
    readSession, saveSession, apiFetch, friendlyError, showToast, renderNav
} from "./shared.js";

const el = (id) => document.getElementById(id);

/*
 * Page keys must match PAGE_DEFAULTS in the Worker exactly.
 * label / fieldLabels are purely for display in this admin UI.
 */
const PAGE_DEFS = [
    {
        key: "global",
        label: "سراسری",
        fieldLabels: {
            footerText: "متن فوتر (پایین همه صفحات)",
        },
    },
    {
        key: "home",
        label: "صفحه اصلی",
        fieldLabels: {
            headerTitle: "عنوان هدر (نام)",
            headerSubtitle: "زیرعنوان هدر (مثلاً عنوان شغلی)",
            tickerText: "متن نوار متحرک خوش‌آمدگویی",
            introTag: "برچسب بخش معرفی",
            introBadge: "برچسب دوم بخش معرفی",
            introTitle: "عنوان بخش معرفی",
            introBody: "متن بخش معرفی",
            productsTag: "برچسب بخش محصولات",
            productsBadge: "برچسب دوم بخش محصولات",
            productsTitle: "عنوان بخش محصولات",
            productsBody: "متن بخش محصولات",
            productsButtonText: "متن دکمه مشاهده محصولات",
        },
    },
    {
        key: "about",
        label: "درباره من",
        fieldLabels: {
            title: "عنوان صفحه",
            bio: "متن بیوگرافی",
            backButtonText: "متن دکمه بازگشت",
        },
    },
    {
        key: "products_page",
        label: "صفحه محصولات",
        fieldLabels: {
            headerTitle: "عنوان هدر",
            headerSubtitle: "زیرعنوان هدر",
            sectionTitle: "عنوان بخش لیست محصولات",
        },
    },
];

const LONG_FIELDS = new Set(["introBody", "productsBody", "bio", "footerText"]);

const state = {
    permissions: [],
    isSuper: false,
    pages: {},        // key -> fields object, loaded from server
    activeKey: PAGE_DEFS[0].key,
};

function can(action) {
    return state.permissions.includes(`pages.${action}`);
}

/* =========================================================
   Boot / auth gate
========================================================= */

async function boot() {
    const session = readSession();

    if (!session?.idToken) {
        el("loading").hidden = true;
        el("loginSection").hidden = false;
        return;
    }

    try {
        const me = await apiFetch("/admin/me");
        state.permissions = me.permissions || [];
        state.isSuper = !!me.isSuper;

        el("navBar").hidden = false;
        renderNav("pages", state.isSuper);

        if (!can("view")) {
            el("loading").hidden = true;
            el("deniedText").textContent = "حساب شما به بخش متن‌های سایت دسترسی ندارد.";
            el("deniedSection").hidden = false;
            el("logoutBtn").hidden = false;
            return;
        }

        el("logoutBtn").hidden = false;
        el("loading").hidden = true;
        el("app").hidden = false;

        el("submitBtn").hidden = !can("edit");

        renderTabs();
        await activateTab(state.activeKey);

    } catch (error) {
        el("loading").hidden = true;

        if (error.status === 401) {
            saveSession(null);
            el("loginSection").hidden = false;
            return;
        }

        el("deniedText").textContent = friendlyError(error);
        el("deniedSection").hidden = false;
        el("logoutBtn").hidden = false;
    }
}

el("logoutBtn").addEventListener("click", () => {
    saveSession(null);
    location.reload();
});

/* ---------- login ---------- */

el("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const errBox = el("loginError");
    errBox.classList.remove("show");

    const email = el("loginEmail").value.trim();
    const password = el("loginPassword").value;
    const btn = el("loginSubmit");

    btn.disabled = true;
    btn.textContent = "در حال ورود...";

    try {
        const result = await apiFetch("/auth/login", {
            method: "POST",
            body: JSON.stringify({ email, password }),
        }, false);

        saveSession({
            idToken: result.idToken,
            refreshToken: result.refreshToken,
            expiresIn: result.expiresIn,
            user: result.user,
        });

        location.reload();

    } catch (error) {
        errBox.textContent = friendlyError(error);
        errBox.classList.add("show");
    } finally {
        btn.disabled = false;
        btn.textContent = "ورود";
    }
});

/* =========================================================
   Tabs
========================================================= */

function renderTabs() {
    const wrap = el("tabs");
    wrap.innerHTML = "";

    for (const def of PAGE_DEFS) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab-btn";
        btn.textContent = def.label;
        btn.dataset.key = def.key;
        btn.addEventListener("click", () => activateTab(def.key));
        wrap.appendChild(btn);
    }
}

function currentDef() {
    return PAGE_DEFS.find((d) => d.key === state.activeKey);
}

async function activateTab(key) {
    state.activeKey = key;

    for (const btn of el("tabs").querySelectorAll(".tab-btn")) {
        btn.classList.toggle("active", btn.dataset.key === key);
    }

    await loadPage(key);
}

/* =========================================================
   Load / render fields
========================================================= */

async function loadPage(key) {
    const status = el("pageStatus");
    const meta = el("pageMeta");
    const container = el("fieldsContainer");

    container.innerHTML = "";
    status.hidden = false;
    status.className = "status-box";
    status.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال بارگذاری...';
    meta.textContent = "";

    try {
        const result = await apiFetch(`/admin/pages/${encodeURIComponent(key)}`);
        state.pages[key] = result.fields || {};

        status.hidden = true;
        meta.textContent = currentDef().label;

        renderFields();

    } catch (error) {
        status.className = "status-box error";
        status.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${escapeHtml(friendlyError(error))}`;
    }
}

function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = String(value ?? "");
    return div.innerHTML;
}

function renderFields() {
    const def = currentDef();
    const fields = state.pages[def.key] || {};
    const container = el("fieldsContainer");
    container.innerHTML = "";

    const readOnly = !can("edit");

    for (const [name, label] of Object.entries(def.fieldLabels)) {
        const wrap = document.createElement("div");
        wrap.className = "field";

        const labelEl = document.createElement("label");
        labelEl.textContent = label;
        wrap.appendChild(labelEl);

        const isLong = LONG_FIELDS.has(name);
        const input = document.createElement(isLong ? "textarea" : "input");

        if (!isLong) input.type = "text";
        input.value = fields[name] ?? "";
        input.dataset.field = name;
        input.disabled = readOnly;
        if (isLong) input.style.minHeight = "100px";

        wrap.appendChild(input);
        container.appendChild(wrap);
    }
}

/* =========================================================
   Save
========================================================= */

el("pageForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!can("edit")) return;

    const def = currentDef();
    const container = el("fieldsContainer");
    const payload = {};

    container.querySelectorAll("[data-field]").forEach((input) => {
        payload[input.dataset.field] = input.value;
    });

    const submitBtn = el("submitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "در حال ذخیره...";

    try {
        await apiFetch(`/admin/pages/${encodeURIComponent(def.key)}`, {
            method: "PUT",
            body: JSON.stringify(payload),
        });

        state.pages[def.key] = { ...state.pages[def.key], ...payload };
        showToast("تغییرات ذخیره شد.");

    } catch (error) {
        showToast(friendlyError(error), "error");
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> ذخیره تغییرات';
    }
});

boot();

</script>

</body>
</html>

<!-- کدهای مربوط به فرم‌های صفحه اصلی در پنل مدیریت -->
<div id="home-settings-form">
  <div class="mb-3">
    <label>عنوان هدر (نام)</label>
    <input type="text" id="headerTitle" class="form-control" placeholder="مثلا: دکتر محمدصادق تاج">
  </div>
  
  <div class="mb-3">
    <label>زیرعنوان هدر (مثلاً عنوان شغلی)</label>
    <input type="text" id="headerSubtitle" class="form-control" placeholder="مثلا: دانشجوی پزشکی و توسعه‌دهنده وب">
  </div>

  <div class="mb-3">
    <label>متن نوار متحرک خوش‌آمدگویی</label>
    <input type="text" id="welcomeText" class="form-control" placeholder="متن خوش‌آمدگویی...">
  </div>

  <div class="mb-3">
    <label>برچسب بخش معرفی</label>
    <input type="text" id="introLabel1" class="form-control">
  </div>

  <div class="mb-3">
    <label>برچسب دوم بخش معرفی</label>
    <input type="text" id="introLabel2" class="form-control">
  </div>

  <div class="mb-3">
    <label>عنوان بخش معرفی</label>
    <input type="text" id="introTitle" class="form-control">
  </div>

  <button id="saveBtn" class="btn btn-success mt-3">ذخیره تغییرات</button>
</div>

<script>
// بارگذاری اطلاعات موجود به محض باز شدن صفحه
async function loadHomeTexts() {
  try {
    const response = await fetch('/api/admin/pages/home', {
      headers: {
        'Authorization': 'Bearer ' + localStorage.getItem('adminIdToken')
      }
    });
    const result = await response.json();
    if (result.ok && result.fields) {
      document.getElementById('headerTitle').value = result.fields.headerTitle || '';
      document.getElementById('headerSubtitle').value = result.fields.headerSubtitle || '';
      document.getElementById('welcomeText').value = result.fields.welcomeText || '';
      document.getElementById('introLabel1').value = result.fields.introLabel1 || '';
      document.getElementById('introLabel2').value = result.fields.introLabel2 || '';
      document.getElementById('introTitle').value = result.fields.introTitle || '';
    }
  } catch (err) {
    console.error('خطا در خواندن اطلاعات:', err);
  }
}

// ذخیره تغییرات با کلیک روی دکمه
document.getElementById('saveBtn').addEventListener('click', async () => {
  const data = {
    headerTitle: document.getElementById('headerTitle').value,
    headerSubtitle: document.getElementById('headerSubtitle').value,
    welcomeText: document.getElementById('welcomeText').value,
    introLabel1: document.getElementById('introLabel1').value,
    introLabel2: document.getElementById('introLabel2').value,
    introTitle: document.getElementById('introTitle').value
  };

  try {
    const response = await fetch('/api/admin/pages/home', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + localStorage.getItem('adminIdToken')
      },
      body: JSON.stringify(data)
    });
    
    const result = await response.json();
    if (result.ok) {
      alert('تغییرات با موفقیت ذخیره شد!');
    } else {
      alert('خطا در ذخیره اطلاعات');
    }
  } catch (err) {
    alert('خطا در ارتباط با سرور');
  }
});

// اجرای تابع بارگذاری هنگام لود صفحه
window.addEventListener('DOMContentLoaded', loadHomeTexts);
</script>
