<!-- کدهای مربوط به فرم‌های صفحه اصلی در پنل مدیریت -->
<div id="home-settings-form">
  <div class="mb-3">
    <label>عنوان هدر (نام)</label>
    <input type="text" id="headerTitle" class="form-control" placeholder="مثلا: دکتر محمدصادق تاج">
  </div>
  
  <div class="mb-3">
    <label>زیرعنوان هدر (مثلاً عنوان شغلی)</label>
    <input type="text" id="headerSubtitle" class="form-control" placeholder="مثلا: دانشجوی پزشکی و توسعه‌دهنده وب">
  </div>

  <div class="mb-3">
    <label>متن نوار متحرک خوش‌آمدگویی</label>
    <input type="text" id="welcomeText" class="form-control" placeholder="متن خوش‌آمدگویی...">
  </div>

  <div class="mb-3">
    <label>برچسب بخش معرفی</label>
    <input type="text" id="introLabel1" class="form-control">
  </div>

  <div class="mb-3">
    <label>برچسب دوم بخش معرفی</label>
    <input type="text" id="introLabel2" class="form-control">
  </div>

  <div class="mb-3">
    <label>عنوان بخش معرفی</label>
    <input type="text" id="introTitle" class="form-control">
  </div>

  <button id="saveBtn" class="btn btn-success mt-3">ذخیره تغییرات</button>
</div>

<script>
// بارگذاری اطلاعات موجود به محض باز شدن صفحه
async function loadHomeTexts() {
  try {
    const response = await fetch('/api/admin/pages/home', {
      headers: {
        'Authorization': 'Bearer ' + localStorage.getItem('adminIdToken')
      }
    });
    const result = await response.json();
    if (result.ok && result.fields) {
      document.getElementById('headerTitle').value = result.fields.headerTitle || '';
      document.getElementById('headerSubtitle').value = result.fields.headerSubtitle || '';
      document.getElementById('welcomeText').value = result.fields.welcomeText || '';
      document.getElementById('introLabel1').value = result.fields.introLabel1 || '';
      document.getElementById('introLabel2').value = result.fields.introLabel2 || '';
      document.getElementById('introTitle').value = result.fields.introTitle || '';
    }
  } catch (err) {
    console.error('خطا در خواندن اطلاعات:', err);
  }
}

// ذخیره تغییرات با کلیک روی دکمه
document.getElementById('saveBtn').addEventListener('click', async () => {
  const data = {
    headerTitle: document.getElementById('headerTitle').value,
    headerSubtitle: document.getElementById('headerSubtitle').value,
    welcomeText: document.getElementById('welcomeText').value,
    introLabel1: document.getElementById('introLabel1').value,
    introLabel2: document.getElementById('introLabel2').value,
    introTitle: document.getElementById('introTitle').value
  };

  try {
    const response = await fetch('/api/admin/pages/home', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + localStorage.getItem('adminIdToken')
      },
      body: JSON.stringify(data)
    });
    
    const result = await response.json();
    if (result.ok) {
      alert('تغییرات با موفقیت ذخیره شد!');
    } else {
      alert('خطا در ذخیره اطلاعات');
    }
  } catch (err) {
    alert('خطا در ارتباط با سرور');
  }
});

// اجرای تابع بارگذاری هنگام لود صفحه
window.addEventListener('DOMContentLoaded', loadHomeTexts);
</script>
