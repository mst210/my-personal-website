<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دسترسی ویزیت آنلاین | پنل ادمین</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="shared.css">
<style>
 .u-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--border-color);border-radius:14px;background:var(--card-bg);margin-bottom:10px}
 .u-row h4{margin:0 0 3px;font-size:14.5px}.u-meta{color:var(--text-muted);font-size:12px;direction:ltr;text-align:right}
 .u-act{display:flex;align-items:center;gap:10px}
 .chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-bottom:6px}
 .hint{color:var(--text-muted);font-size:12px;margin-bottom:10px;line-height:1.9}
</style>
</head>
<body>
<div class="page-container">
 <div class="top-header">
  <div class="header-title"><h1>دسترسی ویزیت آنلاین</h1><p>تعیین اینکه کدام اعضا می‌توانند وارد اتاق ویزیت شوند</p></div>
  <div class="header-actions"><a class="icon-btn btn-primary" id="roomBtn" href="../visit.html" hidden><i class="fa-solid fa-video"></i> ورود به اتاق ویزیت</a><button class="icon-btn" id="logoutBtn" hidden><i class="fa-solid fa-right-from-bracket"></i> خروج</button></div>
 </div>
 <div class="nav-bar" id="navBar" hidden></div>
 <section id="loading" class="status-box"><i class="fa-solid fa-spinner fa-spin"></i> در حال بررسی دسترسی...</section>
 <section id="denied" class="status-box error" hidden><i class="fa-solid fa-lock"></i><div id="deniedText">برای ورود ابتدا از <a href="index.html" style="text-decoration:underline">داشبورد</a> وارد شوید.</div></section>

 <section id="app" hidden>
  <div class="stat-grid" id="stats"></div>

  <div class="section-card" id="waitCard" hidden>
   <h2><i class="fa-solid fa-hourglass-half"></i> بیماران منتظر</h2>
   <div id="waitList"></div>
  </div>

  <div class="section-card">
   <h2><i class="fa-solid fa-shield-halved"></i> حالت دسترسی</h2>
   <label class="chk"><input type="checkbox" id="sRestricted"> فقط اعضای مجاز بتوانند وارد ویزیت آنلاین شوند</label>
   <div class="hint">اگر خاموش باشد همهٔ کاربران واردشده می‌توانند وارد اتاق انتظار شوند. پیشنهاد می‌شود روشن بماند.</div>
   <label class="chk"><input type="checkbox" id="sOpen"> ویزیت آنلاین فعال باشد (با خاموش کردن، فعلاً هیچ‌کس نمی‌تواند وارد شود)</label>
   <button class="icon-btn btn-primary" id="saveSettings" style="margin-top:8px">ذخیره تنظیمات</button>
  </div>

  <div class="section-card">
   <h2><i class="fa-solid fa-user-check"></i> اعضا</h2>
   <div class="toolbar">
    <input class="search-input" id="search" type="search" placeholder="جستجو با نام، ایمیل یا تلفن...">
    <select id="filter" class="field" style="width:auto;padding:9px">
     <option value="all">همه</option><option value="allowed">دارای دسترسی</option><option value="denied">بدون دسترسی</option>
    </select>
   </div>
   <div id="list"></div>
  </div>
 </section>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { apiFetch, friendlyError, showToast, escapeHtml, renderNav, readSession, saveSession } from "./shared.js";
const $ = id => document.getElementById(id);
const S = { perms: [], isSuper: false, users: [], settings: {} };
const can = a => S.isSuper || S.perms.includes("visit." + a);
const api = (p, m, b) => apiFetch("/admin/visit" + p, m ? { method: m, body: b ? JSON.stringify(b) : undefined } : {});

async function boot() {
  if (!readSession()?.idToken) { $("loading").hidden = true; $("denied").hidden = false; return; }
  try {
    const me = await apiFetch("/admin/me");
    S.perms = me.permissions || []; S.isSuper = !!me.isSuper;
    $("navBar").hidden = false; renderNav("visit", S.isSuper); $("logoutBtn").hidden = false;
    if (!can("view")) throw Object.assign(new Error(), { code: "FORBIDDEN" });
    $("loading").hidden = true; $("app").hidden = false;
    $("roomBtn").hidden = false; $("waitCard").hidden = false;
    await Promise.all([loadSettings(), loadUsers()]);
    loadWaiting(); setInterval(() => { if (!document.hidden) loadWaiting(); }, 5000);
  } catch (e) {
    $("loading").hidden = true;
    if (e.status === 401) { saveSession(null); $("denied").hidden = false; return; }
    $("deniedText").textContent = friendlyError(e); $("denied").hidden = false;
  }
}
$("logoutBtn").onclick = () => { saveSession(null); location.reload(); };

async function loadSettings() {
  try { S.settings = (await api("/settings")).settings || {}; } catch { S.settings = {}; }
  $("sRestricted").checked = S.settings.restricted !== false;
  $("sOpen").checked = S.settings.open !== false;
}
$("saveSettings").onclick = async () => {
  if (!can("edit")) return showToast("مجوز ویرایش ندارید.", "error");
  try {
    await api("/settings", "PUT", { restricted: $("sRestricted").checked, open: $("sOpen").checked });
    showToast("تنظیمات ذخیره شد."); loadSettings();
  } catch (e) { showToast(friendlyError(e), "error"); }
};

async function loadUsers() {
  $("list").innerHTML = '<div class="status-box"><i class="fa-solid fa-spinner fa-spin"></i></div>';
  try { S.users = (await api("/access")).users || []; render(); }
  catch (e) { $("list").innerHTML = `<div class="status-box error"><i class="fa-solid fa-circle-exclamation"></i>${escapeHtml(friendlyError(e))}</div>`; }
}
function stats() {
  const n = S.users.length, a = S.users.filter(u => u.allowed).length;
  $("stats").innerHTML = [["کل اعضا", n, "fa-users"], ["دارای دسترسی ویزیت", a, "fa-video"], ["بدون دسترسی", n - a, "fa-user-slash"]]
    .map(([l, v, i]) => `<div class="stat-card"><div><div style="font-size:22px;font-weight:700">${v.toLocaleString("fa-IR")}</div><div class="u-meta" style="direction:rtl">${l}</div></div><i class="fa-solid ${i}" style="margin-right:auto;color:var(--accent-teal)"></i></div>`).join("");
}
function render() {
  stats();
  const q = $("search").value.trim().toLowerCase(), f = $("filter").value;
  const rows = S.users.filter(u => (f === "all" || (f === "allowed") === !!u.allowed) &&
    (!q || [u.name, u.email, u.phone].join(" ").toLowerCase().includes(q)));
  $("list").innerHTML = rows.length ? rows.map(u => `
   <div class="u-row"><div><h4>${escapeHtml(u.name || "بدون نام")}</h4>
    <div class="u-meta">${escapeHtml(u.email || u.id)}${u.phone ? " · " + escapeHtml(u.phone) : ""}</div></div>
    <div class="u-act"><span class="badge ${u.allowed ? "published" : "draft"}">${u.allowed ? "مجاز" : "بدون دسترسی"}</span>
     <label class="switch"><input type="checkbox" data-u="${escapeHtml(u.id)}" ${u.allowed ? "checked" : ""} ${can("edit") ? "" : "disabled"}><span class="slider"></span></label></div></div>`).join("")
   : '<div class="status-box"><i class="fa-regular fa-folder-open"></i>موردی وجود ندارد.</div>';
  $("list").querySelectorAll("[data-u]").forEach(c => c.onchange = () => setAccess(c));
}
async function setAccess(box) {
  const uid = box.dataset.u, allowed = box.checked, u = S.users.find(x => x.id === uid);
  box.disabled = true;
  try { await api("/access/" + encodeURIComponent(uid), "PUT", { allowed }); if (u) u.allowed = allowed; showToast(allowed ? "دسترسی ویزیت داده شد." : "دسترسی ویزیت برداشته شد."); }
  catch (e) { box.checked = !allowed; showToast(friendlyError(e), "error"); }
  box.disabled = false; render();
}
async function loadWaiting() {
  try {
    const rooms = (await apiFetch("/visit/waiting")).rooms || [];
    $("waitList").innerHTML = rooms.length ? rooms.map(r => `<div class="u-row"><div><h4>${escapeHtml(r.name || "بیمار")}</h4><div class="u-meta" style="direction:rtl">در صف انتظار</div></div>
      <a class="icon-btn btn-primary" href="../visit.html"><i class="fa-solid fa-video"></i> شروع ویزیت</a></div>`).join("")
      : '<div class="hint" style="margin:0">فعلاً بیماری منتظر نیست. این فهرست هر ۵ ثانیه تازه می‌شود.</div>';
  } catch { $("waitList").innerHTML = '<div class="hint" style="margin:0">دریافت فهرست انتظار ممکن نشد.</div>'; }
}
$("search").oninput = render; $("filter").onchange = render;
boot();
</script>
</body>
</html>
