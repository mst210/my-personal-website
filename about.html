<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بیوگرافی | دکتر محمدصادق تاج</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Tahoma, Vazir, sans-serif;
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: justify;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-out forwards;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #38bdf8;
            text-align: center;
        }
        p {
            color: #e2e8f0;
            font-size: 15px;
            line-height: 1.9;
            margin-bottom: 25px;
        }
        .back-btn {
            display: block;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .back-btn:hover {
            background: #ffffff;
            color: #0f172a;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>بیوگرافی و درباره من</h1>
        
        <p>
            سلام، من دکتر محمدصادق تاج هستم. متن زندگینامه و خلاصه‌ای از فعالیت‌ها، تحصیالت و تجربیات شما در این بخش قرار می‌گیرد.
        </p>

        <a href="index.html" class="back-btn">بازگشت به صفحه اصلی ➔</a>
    </div>

</body>
</html>
