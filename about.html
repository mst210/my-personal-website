<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بیوگرافی | دکتر محمدصادق تاج</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f172a'/%3E%3Cpath d='M50 20c-8 0-14 6-14 14v6h-8v10h8v8c0 8 6 14 14 14s14-6 14-14v-8h8V40h-8v-6c0-8-6-14-14-14z' fill='%2314b8a6'/%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --primary-blue: #0284c7;
            --accent-teal: #14b8a6;
            --gradient-primary: linear-gradient(135deg, var(--primary-blue), var(--accent-teal));
        }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: #0b1324;
            background-image: linear-gradient(rgba(11, 19, 36, 0.86), rgba(11, 19, 36, 0.86)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
        }
        body::before { width: 380px; height: 380px; top: -140px; right: -100px; background: rgba(2, 132, 199, 0.3); }
        body::after { width: 340px; height: 340px; bottom: -140px; left: -100px; background: rgba(20, 184, 166, 0.22); }
        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 22px;
            padding: 44px 32px 34px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45);
            animation: fadeIn .7s ease-out forwards;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--gradient-primary);
        }
        .avatar-badge {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            margin: 0 auto 18px;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 0 24px rgba(20, 184, 166, 0.4);
        }
        h1 {
            font-size: 23px;
            margin-bottom: 18px;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        p {
            color: #cbd5e1;
            font-size: 16px;
            line-height: 1.9;
            margin-bottom: 30px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            text-align: center;
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.16);
        }
        .back-btn:hover {
            background: var(--gradient-primary);
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(20, 184, 166, 0.3);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar-badge"><i class="fa-solid fa-user-doctor"></i></div>

        <h1>بیوگرافی و درباره من</h1>
        
        <p id="site-about-bio">
            .
        </p>

        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-right"></i>
            <span id="site-about-back">بازگشت به صفحه اصلی</span>
        </a>
    </div>

    <script>
        (function () {
            fetch('/api/public/pages/about')
                .then(function (r) { return r.json(); })
                .then(function (result) {
                    if (!result || !result.ok || !result.fields) return;
                    var data = result.fields;
                    var titleEl = document.querySelector('h1');
                    var bioEl = document.getElementById('site-about-bio');
                    var backEl = document.getElementById('site-about-back');
                    if (data.title && titleEl) titleEl.textContent = data.title;
                    if (data.bio && bioEl) bioEl.textContent = data.bio;
                    if (data.backButtonText && backEl) backEl.textContent = data.backButtonText;
                })
                .catch(function (err) { console.error('site content fetch failed', err); });
        })();
    </script>

</body>
</html>
