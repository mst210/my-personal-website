<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل من</title>
    <!-- ایمپورت فونت Vazirmatn از گوگل فونتس -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0284c7;
            --accent-teal: #14b8a6;
            --dark-bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        /* اعمال سراسری فونت وزیرمتن روی تمام عناصر، دکمه‌ها و فرم‌ها */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Vazirmatn', Tahoma, sans-serif !important; 
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            direction: rtl;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex: 1;
        }

        header {
            text-align: center;
            padding: 40px 0;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #f8fafc;
        }

        header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: var(--accent-teal);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* استایل فرم‌ها و دکمه‌ها با فونت یکپارچه */
        input, textarea, select, button {
            font-size: 1rem;
            outline: none;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #ffffff;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
        }

        button, .btn {
            background: linear-gradient(135deg, var(--primary-blue), #0369a1);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-block;
            text-align: center;
            text-decoration: none;
        }

        button:hover, .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
        }

        footer {
            text-align: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.8);
            border-top: 1px solid var(--border-color);
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>به وبسایت من خوش آمدید</h1>
            <p>طراحی شده با دقت و استایل مدرن</p>
        </header>

        <section class="card">
            <h2>درباره من</h2>
            <p>این بخش شامل توضیحات و بیوگرافی شماست. تمامی نوشته‌ها، منوها، کادرها و دکمه‌ها اکنون از فونت یکدست و زیبای Vazirmatn استفاده می‌کنند.</p>
        </section>

        <section class="card">
            <h2>ارتباط با من</h2>
            <form>
                <label for="name">نام و نام خانوادگی:</label>
                <input type="text" id="name" placeholder="نام خود را وارد کنید...">

                <label for="message">پیام شما:</label>
                <textarea id="message" rows="4" placeholder="متن پیام..."></textarea>

                <button type="submit">ارسال پیام</button>
            </form>
        </section>
    </div>

    <footer>
        <p>تمامی حقوق محفوظ است.</p>
    </footer>

</body>
</html>
