<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل کاربری - دکتر محمدصادق تاج</title>
    <!-- استایل‌های صفحه (می‌توانید فایل CSS خود را اینجا قرار دهید یا داخل تگ استایل بنویسید) -->
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; direction: rtl; }
        .dashboard-container { display: flex; height: 100vh; }
        .sidebar { width: 250px; background: #2c3e50; color: #fff; padding: 20px; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #3498db; color: #fff; border: none; padding: 10px 20px; cursor: pointer; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- منوی کناری -->
        <div class="sidebar">
            <h2>پنل کاربری</h2>
            <ul>
                <li>پروفایل</li>
                <li>سفارش‌ها</li>
                <li>خروج</li>
            </ul>
        </div>

        <!-- محتوای اصلی -->
        <div class="main-content">
            <h1>خوش آمدید</h1>
            <div id="auth-section">
                <h3>ثبت‌نام / ورود</h3>
                <div class="form-group">
                    <label>ایمیل:</label>
                    <input type="email" id="email" placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label>رمز عبور:</label>
                    <input type="password" id="password" placeholder="رمز عبور">
                </div>
                <button id="register-btn">ثبت‌نام</button>
                <button id="login-btn">ورود</button>
                <p id="error-msg" style="color: red;"></p>
            </div>
        </div>
    </div>

    <!-- اسکریپت‌های اتصال به فایربیس و پروکسی -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // تنظیمات فایربیس
        const firebaseConfig = {
            apiKey: "AIzaSyBIiroBz28UYsDj5d42hQfOpvWI3m7pZVM",
            authDomain: "taj-medical-panel.firebaseapp.com",
            projectId: "taj-medical-panel",
            storageBucket: "taj-medical-panel.firebasestorage.app",
            messagingSenderId: "691798594131",
            appId: "1:691798594131:web:95a52a15ab780058b9aca6",
            measurementId: "G-7DQ20FR1KM"
        };

        // راه‌اندازی فایربیس
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // هدایت درخواست‌های احراز هویت به ورکر Cloudflare برای دور زدن تحریم بدون نیاز به VPN
        auth.config.apiHost = "https://auth-proxy.mst-taj1383.workers.dev";

        // منطق دکمه ثبت‌نام
        document.getElementById('register-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                errorMsg.textContent = "در حال ارسال اطلاعات...";
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // ذخیره اطلاعات تکمیلی در فایراستور
                await setDoc(doc(db, "users", user.uid), {
                    email: email,
                    createdAt: new Date().toISOString()
                });

                alert("ثبت‌نام با موفقیت انجام شد!");
                errorMsg.textContent = "";
            } catch (error) {
                errorMsg.textContent = "خطا: " + error.message;
            }
        });

        // منطق دکمه ورود
        document.getElementById('login-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                errorMsg.textContent = "در حال ورود...";
                await signInWithEmailAndPassword(auth, email, password);
                alert("ورود با موفقیت انجام شد!");
                errorMsg.textContent = "";
            } catch (error) {
                errorMsg.textContent = "خطا: " + error.message;
            }
        });
    </script>
</body>
</html>
