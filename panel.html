<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل شخصی | دکتر محمدصادق تاج</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-blue: #0284c7; --accent-teal: #14b8a6; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Tahoma, 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff; min-height: 100vh; padding: 20px;
        }
        .panel-container {
            max-width: 800px; margin: 40px auto; background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .header-panel { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 20px; }
        .welcome-title { font-size: 18px; color: var(--accent-teal); }
        .logout-btn { background: #ef4444; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .back-btn { background: rgba(255,255,255,0.1); color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="panel-container">
        <div class="header-panel">
            <div class="welcome-title">
                <i class="fa-solid fa-user-check"></i> خوش آمدید، <span id="user-display-name">کاربر گرامی</span>
            </div>
            <div>
                <a href="index.html" class="back-btn"><i class="fa-solid fa-house"></i> صفحه اصلی</a>
                <button onclick="logout()" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
            </div>
        </div>
        <p style="color: #94a3b8; line-height: 1.8;">
            به پنل اختصاصی خود خوش آمدید. پرونده و اطلاعات شما در این بخش قابل مدیریت خواهد بود.
        </p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDjStT4d8jATJaRqXwNtxDISMvH30ZXn6c",
            authDomain: "mymedicalsites-48184.firebaseapp.com",
            projectId: "mymedicalsites-48184",
            storageBucket: "mymedicalsites-48184.firebasestorage.app",
            messagingSenderId: "647039366833",
            appId: "1:647039366833:web:e3ae440228960f02519490"
        };
        firebase.initializeApp(firebaseConfig);

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('user-display-name').textContent = user.displayName || user.email;
            } else {
                window.location.href = 'login.html';
            }
        });

        function logout() {
            firebase.auth().signOut().then(() => {
                window.location.href = 'login.html';
            });
        }
    </script>
</body>
</html>
