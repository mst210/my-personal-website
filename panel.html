<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محصولات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-teal: #14b8a6;
            --text-color: #f8fafc;
            --border-color: #334155;
        }
        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .product-price {
            color: var(--accent-teal);
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .buy-btn {
            background-color: var(--accent-teal);
            color: #0f172a;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .buy-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>محصولات ما</h1>
        <div class="products-grid">
            <!-- محصول اول -->
            <div class="product-card">
                <div>
                    <div class="product-title">دوره جامع پایتون</div>
                    <div class="product-price">۱,۲۰۰,۰۰۰ تومان</div>
                </div>
                <button class="buy-btn" onclick="buyProduct('دوره جامع پایتون', '۱,۲۰۰,۰۰۰ تومان')">خرید محصول</button>
            </div>

            <!-- محصول دوم -->
            <div class="product-card">
                <div>
                    <div class="product-title">آموزش فرانت‌اند پیشرفته</div>
                    <div class="product-price">۹50,000 تومان</div>
                </div>
                <button class="buy-btn" onclick="buyProduct('آموزش فرانت‌اند پیشرفته', '۹50,000 تومان')">خرید محصول</button>
            </div>

            <!-- محصول سوم -->
            <div class="product-card">
                <div>
                    <div class="product-title">مشاوره تخصصی هوش مصنوعی</div>
                    <div class="product-price">۵۰۰,۰۰۰ تومان</div>
                </div>
                <button class="buy-btn" onclick="buyProduct('مشاوره تخصصی هوش مصنوعی', '۵۰۰,۰۰۰ تومان')">خرید محصول</button>
            </div>
        </div>
    </div>

    <script>
        function buyProduct(title, price) {
            // ذخیره محصول به عنوان سبد خرید موقت
            const cartItem = {
                title: title,
                price: price,
                date: new Date().toLocaleDateString('fa-IR')
            };
            localStorage.setItem('user_cart', JSON.stringify(cartItem));
            
            // انتقال کاربر به پنل کاربری
            window.location.href = 'panel.html';
        }
    </script>
</body>
</html>
