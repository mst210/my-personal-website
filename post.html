<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مطلب | دکتر محمدصادق تاج</title>
    <meta name="robots" content="index, follow">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f172a'/%3E%3Cpath d='M50 20c-8 0-14 6-14 14v6h-8v10h8v8c0 8 6 14 14 14s14-6 14-14v-8h8V40h-8v-6c0-8-6-14-14-14z' fill='%2314b8a6'/%3E%3C/svg%3E">

    <!-- Vazirmatn Font CDN -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
          rel="stylesheet"
          type="text/css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        :root {
            --primary-blue: #0284c7;
            --dark-blue: #0f172a;
            --accent-teal: #14b8a6;
            --gradient-primary: linear-gradient(135deg, var(--primary-blue), var(--accent-teal));
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: #0b1324;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            pointer-events: none;
        }

        body::before { width: 420px; height: 420px; top: -140px; left: -120px; background: rgba(2, 132, 199, 0.35); }
        body::after { width: 380px; height: 380px; bottom: -160px; right: -100px; background: rgba(20, 184, 166, 0.25); }

        header {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 14px 24px;
        }

        header::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: -1px;
            height: 2px;
            background: var(--gradient-primary);
            opacity: .6;
        }

        .header-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #ffffff;
            text-decoration: none;
            padding: 9px 15px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: all 0.25s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        main {
            flex-grow: 1;
            max-width: 760px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px 50px;
        }

        #status {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        #status i { font-size: 26px; display: block; margin-bottom: 12px; color: var(--accent-teal); }

        article {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 28px 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        article::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--gradient-primary);
            opacity: .8;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .post-tag {
            background: rgba(20, 184, 166, 0.15);
            color: #5eead4;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 11px;
            border-radius: 999px;
            border: 1px solid rgba(20, 184, 166, 0.35);
        }

        .post-date {
            font-size: 12.5px;
            color: #94a3b8;
        }

        .post-title {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .post-body p {
            color: #cbd5e1;
            font-size: 15px;
            line-height: 2;
            text-align: justify;
            margin-bottom: 16px;
        }

        .post-body p:last-child { margin-bottom: 0; }

        footer {
            text-align: center;
            padding: 24px 20px;
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }


        .post-cover {
            margin: 0 0 22px;
            border-radius: 14px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .post-cover img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 480px;
            object-fit: cover;
        }
        @media (max-width: 600px) {
            .post-title { font-size: 19px; }
            article { padding: 20px 16px; }
        }

    </style>
</head>

<body>

    <header>
        <div class="header-container">
            <a href="index.html" class="back-btn">
                <i class="fa-solid fa-arrow-right"></i>
                بازگشت به صفحه اصلی
            </a>
        </div>
    </header>

    <main>
        <div id="status">
            <i class="fa-solid fa-spinner fa-spin"></i>
            در حال دریافت مطلب...
        </div>

        <article id="postArticle" hidden>
            <div class="post-header">
                <span class="post-tag" id="postTag"></span>
                <span class="post-date" id="postDate"></span>
            </div>
            <h1 class="post-title" id="postTitle"></h1>
            <figure class="post-cover" id="postCover" hidden>
                <img id="postCoverImg" alt="">
            </figure>
            <div class="post-body" id="postBody"></div>
        </article>
    </main>

    <footer id="site-footer-text">
        © کلیه حقوق برای دکتر محمدصادق تاج محفوظ است.
    </footer>

    <script>
        (function () {
            var API_BASE = "/api";

            function typeLabel(type) {
                return type === "news" ? "خبر" : "مطلب پزشکی";
            }

            function formatDate(value) {
                if (!value) return "";
                try {
                    return new Date(value).toLocaleDateString("fa-IR", {
                        year: "numeric", month: "long", day: "numeric"
                    });
                } catch (e) {
                    return "";
                }
            }

            function showStatus(html) {
                var statusEl = document.getElementById("status");
                statusEl.innerHTML = html;
                statusEl.hidden = false;
                document.getElementById("postArticle").hidden = true;
            }

            var params = new URLSearchParams(window.location.search);
            var id = params.get("id");

            if (!id) {
                showStatus('<i class="fa-solid fa-circle-exclamation"></i> شناسه مطلب مشخص نیست.');
                return;
            }

            fetch(API_BASE + "/public/posts/" + encodeURIComponent(id))
                .then(function (response) {
                    if (!response.ok) throw new Error("not found");
                    return response.json();
                })
                .then(function (result) {
                    if (!result || !result.ok || !result.post) throw new Error("not found");

                    var post = result.post;

                    document.title = (post.title || "مطلب") + " | دکتر محمدصادق تاج";

                    document.getElementById("postTag").textContent = post.category || typeLabel(post.type);
                    document.getElementById("postDate").textContent = formatDate(post.publishedAt);
                    document.getElementById("postTitle").textContent = post.title || "";

                    /* cover image (only https links; hidden if it fails to load) */
                    var coverEl = document.getElementById("postCover");
                    var coverImg = document.getElementById("postCoverImg");

                    if (/^https:\/\//i.test(String(post.imageUrl || ""))) {
                        coverImg.alt = post.title || "";
                        coverImg.referrerPolicy = "no-referrer";
                        coverImg.addEventListener("error", function () { coverEl.hidden = true; });
                        coverImg.src = post.imageUrl;
                        coverEl.hidden = false;
                    }

                    var bodyEl = document.getElementById("postBody");
                    bodyEl.innerHTML = "";

                    var paragraphs = String(post.body || "")
                        .split(/\n\s*\n/)
                        .map(function (part) { return part.trim(); })
                        .filter(Boolean);

                    if (!paragraphs.length && post.summary) {
                        paragraphs = [post.summary];
                    }

                    paragraphs.forEach(function (paragraph) {
                        var p = document.createElement("p");
                        p.textContent = paragraph;
                        bodyEl.appendChild(p);
                    });

                    document.getElementById("status").hidden = true;
                    document.getElementById("postArticle").hidden = false;
                })
                .catch(function () {
                    showStatus('<i class="fa-solid fa-circle-exclamation"></i> این مطلب پیدا نشد یا حذف شده است.');
                });

            fetch(API_BASE + "/public/pages/global")
                .then(function (r) { return r.json(); })
                .then(function (result) {
                    var footerEl = document.getElementById("site-footer-text");
                    if (result && result.ok && result.fields && result.fields.footerText && footerEl) {
                        footerEl.textContent = result.fields.footerText;
                    }
                })
                .catch(function () {});
        })();
    </script>

</body>
</html>
