    <script>

        /* ==========================================
           API (پنل ادمین / Cloudflare Worker)
        ========================================== */

        const PRODUCTS_API_URL = '/api/public/products';

        const FALLBACK_IMAGE =
            'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20300%20200%22%3E%3Crect%20width%3D%22300%22%20height%3D%22200%22%20fill%3D%22%23eef1f4%22/%3E%3Crect%20x%3D%22110%22%20y%3D%2270%22%20width%3D%2280%22%20height%3D%2260%22%20rx%3D%228%22%20fill%3D%22none%22%20stroke%3D%22%230f8a94%22%20stroke-width%3D%225%22/%3E%3Cpath%20d%3D%22M135%2070v-15a15%2015%200%200130%200v15%22%20fill%3D%22none%22%20stroke%3D%22%230f8a94%22%20stroke-width%3D%225%22/%3E%3C/svg%3E';

        const DEFAULT_CATEGORY = 'سایر محصولات';


        /* ==========================================
           CART  (بدون تغییر نسبت به قبل)
        ========================================== */

        const CART_KEY = 'taj_medical_cart';

        function getCart() {
            try {
                return JSON.parse(localStorage.getItem(CART_KEY)) || [];
            } catch (error) {
                console.error('خطا در خواندن سبد خرید:', error);
                return [];
            }
        }

        function saveCart(cart) {
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
        }

        function buyProduct(id, title, price, image) {
            const cart = getCart();
            const existingProduct = cart.find(item => item.id === id);

            if (existingProduct) {
                existingProduct.quantity = (Number(existingProduct.quantity) || 1) + 1;
            } else {
                cart.push({
                    id: id,
                    name: title,
                    title: title,
                    price: Number(price) || 0,
                    image: image,
                    quantity: 1
                });
            }

            saveCart(cart);
            updateCartCount();
            showToast('محصول «' + title + '» به سبد خرید اضافه شد ✓');
            renderCartPreview(true);

            const buttons = document.querySelectorAll('.order-btn');
            buttons.forEach(function (button) {
                const buttonId = button.getAttribute('data-product-id');
                if (buttonId === id) {
                    button.classList.add('added');
                    button.innerHTML = '<i class="fa-solid fa-check"></i> افزوده شد';
                    setTimeout(function () {
                        button.classList.remove('added');
                        button.innerHTML = '<i class="fa-solid fa-cart-plus"></i> افزودن به سبد';
                    }, 1500);
                }
            });
        }

        function getTotalCartCount() {
            const cart = getCart();
            return cart.reduce(function (total, item) {
                return total + (Number(item.quantity) || 1);
            }, 0);
        }

        function updateCartCount() {
            const totalCount = getTotalCartCount();
            const cartCount = document.getElementById('cart-count');
            if (cartCount) {
                cartCount.textContent = totalCount.toLocaleString('fa-IR');
            }
        }

        function formatPrice(price) {
            return Number(price || 0).toLocaleString('fa-IR') + ' تومان';
        }

        function getCartTotal() {
            const cart = getCart();
            return cart.reduce(function (total, item) {
                const price = Number(item.price) || 0;
                const quantity = Number(item.quantity) || 1;
                return total + (price * quantity);
            }, 0);
        }

        function renderCartPreview(shouldScroll) {
            const cart = getCart();
            const preview = document.getElementById('cart-preview');
            const itemsContainer = document.getElementById('cart-items');
            const countElement = document.getElementById('cart-preview-count');
            const totalElement = document.getElementById('cart-total-price');
            const totalCount = getTotalCartCount();

            countElement.textContent = totalCount.toLocaleString('fa-IR') + ' کالا';
            totalElement.textContent = formatPrice(getCartTotal());

            if (!cart.length) {
                itemsContainer.innerHTML =
                    '<div class="empty-cart">' +
                        '<i class="fa-solid fa-cart-shopping"></i>' +
                        '<p>سبد خرید شما خالی است.</p>' +
                    '</div>';
                preview.classList.remove('show');
                return;
            }

            preview.classList.add('show');
            itemsContainer.innerHTML = '';

            cart.forEach(function (item, index) {
                const quantity = Number(item.quantity) || 1;
                const price = Number(item.price) || 0;
                const itemTotal = price * quantity;

                const itemElement = document.createElement('div');
                itemElement.className = 'cart-item';

                itemElement.innerHTML =
                    '<img src="' + escapeHtml(item.image || FALLBACK_IMAGE) + '" class="cart-item-image" alt="' + escapeHtml(item.title || item.name || 'محصول') + '">' +
                    '<div class="cart-item-info">' +
                        '<div class="cart-item-name">' + escapeHtml(item.title || item.name || 'محصول پزشکی') + '</div>' +
                        '<div class="cart-item-price">' + formatPrice(itemTotal) + '</div>' +
                    '</div>' +
                    '<div class="quantity-box">' +
                        '<button type="button" class="quantity-btn decrease-btn" data-index="' + index + '"><i class="fa-solid fa-minus"></i></button>' +
                        '<span class="quantity-number">' + quantity.toLocaleString('fa-IR') + '</span>' +
                        '<button type="button" class="quantity-btn increase-btn" data-index="' + index + '"><i class="fa-solid fa-plus"></i></button>' +
                    '</div>' +
                    '<button type="button" class="remove-cart-item" data-index="' + index + '" title="حذف محصول"><i class="fa-solid fa-trash"></i></button>';

                itemsContainer.appendChild(itemElement);
            });

            document.querySelectorAll('.decrease-btn').forEach(function (button) {
                button.addEventListener('click', function () {
                    changeQuantity(Number(this.getAttribute('data-index')), -1);
                });
            });

            document.querySelectorAll('.increase-btn').forEach(function (button) {
                button.addEventListener('click', function () {
                    changeQuantity(Number(this.getAttribute('data-index')), 1);
                });
            });

            document.querySelectorAll('.remove-cart-item').forEach(function (button) {
                button.addEventListener('click', function () {
                    removeCartItem(Number(this.getAttribute('data-index')));
                });
            });

            if (shouldScroll) {
                setTimeout(function () {
                    preview.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 80);
            }
        }

        function changeQuantity(index, change) {
            const cart = getCart();
            if (!cart[index]) return;

            cart[index].quantity = (Number(cart[index].quantity) || 1) + change;

            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }

            saveCart(cart);
            updateCartCount();
            renderCartPreview(false);
        }

        function removeCartItem(index) {
            const cart = getCart();
            if (!cart[index]) return;

            const title = cart[index].title || cart[index].name || 'محصول';
            cart.splice(index, 1);
            saveCart(cart);
            updateCartCount();
            renderCartPreview(false);
            showToast('«' + title + '» از سبد خرید حذف شد');
        }

        document.getElementById('cart-button').addEventListener('click', function () {
            const cart = getCart();
            if (!cart.length) {
                showToast('سبد خرید شما خالی است');
                return;
            }
            renderCartPreview(true);
        });

        document.getElementById('continue-shopping-btn').addEventListener('click', function () {
            document.getElementById('products-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        document.getElementById('checkout-btn').addEventListener('click', function () {
            const cart = getCart();
            if (!cart.length) {
                showToast('سبد خرید شما خالی است');
                return;
            }
            window.location.href = 'panel.html';
        });

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(function () {
                toast.classList.remove('show');
            }, 2200);
        }


        /* ==========================================
           ساخت کارت یک محصول
        ========================================== */

        function buildProductCard(product) {
            const title = product.title ? String(product.title) : 'دستگاه پزشکی';
            const desc = product.description ? String(product.description) : '';
            const price = (product.price !== undefined && product.price !== null) ? product.price : 0;
            const image = product.imageUrl ? String(product.imageUrl) : FALLBACK_IMAGE;
            const productId = String(product.id);

            const formattedPrice = (typeof price === 'number' && !isNaN(price))
                ? price.toLocaleString('fa-IR') + ' تومان'
                : String(price);

            const card = document.createElement('div');
            card.className = 'product-card';
            card.dataset.title = title.toLowerCase();
            card.dataset.category = String(product.category || DEFAULT_CATEGORY).toLowerCase();

            const link = document.createElement('a');
            link.className = 'product-link';
            link.href = 'product.html?id=' + encodeURIComponent(productId);

            const imageWrap = document.createElement('div');
            imageWrap.className = 'product-image-wrap';

            const img = document.createElement('img');
            img.src = image;
            img.alt = title;
            img.className = 'product-image';
            img.onerror = function () { this.src = FALLBACK_IMAGE; };
            imageWrap.appendChild(img);

            const titleElement = document.createElement('div');
            titleElement.className = 'product-title';
            titleElement.textContent = title;

            const priceElement = document.createElement('div');
            priceElement.className = 'product-price';
            priceElement.textContent = formattedPrice;

            const button = document.createElement('button');
            button.className = 'order-btn';
            button.setAttribute('data-product-id', productId);
            button.innerHTML = '<i class="fa-solid fa-cart-plus"></i> افزودن به سبد';

            button.addEventListener('click', function () {
                let numericPrice = parseFloat(price);
                if (isNaN(numericPrice)) numericPrice = 0;
                buyProduct(productId, title, numericPrice, image);
            });

            link.appendChild(imageWrap);
            link.appendChild(titleElement);

            if (desc) {
                const descElement = document.createElement('div');
                descElement.className = 'product-desc';
                descElement.textContent = desc;
                link.appendChild(descElement);
            }

            link.appendChild(priceElement);

            card.appendChild(link);
            card.appendChild(button);

            return card;
        }


        /* ==========================================
           گروه‌بندی محصولات بر اساس دسته‌بندی
           و ساخت بخش‌های کاروسل مانند irantebco
        ========================================== */

        function renderProducts(products) {
            const container = document.getElementById('products-container');
            const navInner = document.getElementById('category-nav-inner');
            const nav = document.getElementById('category-nav');

            container.innerHTML = '';
            navInner.innerHTML = '';

            if (!products.length) {
                container.innerHTML = '<div class="loading-text">هیچ محصولی ثبت نشده است.</div>';
                nav.hidden = true;
                return;
            }

            /* گروه‌بندی بر اساس دسته‌بندی */
            const groups = new Map();

            products.forEach(function (product) {
                const category = (product.category && String(product.category).trim())
                    ? String(product.category).trim()
                    : DEFAULT_CATEGORY;

                if (!groups.has(category)) groups.set(category, []);
                groups.get(category).push(product);
            });

            /* مرتب‌سازی محصولات داخل هر دسته بر اساس order، سپس عنوان */
            groups.forEach(function (list) {
                list.sort(function (a, b) {
                    const orderDiff = (a.order || 0) - (b.order || 0);
                    if (orderDiff !== 0) return orderDiff;
                    return String(a.title || '').localeCompare(String(b.title || ''), 'fa');
                });
            });

            /* مرتب‌سازی دسته‌ها بر اساس کمترین order محصولاتشان */
            const categories = Array.from(groups.keys()).sort(function (catA, catB) {
                const minA = Math.min.apply(null, groups.get(catA).map(function (p) { return p.order || 0; }));
                const minB = Math.min.apply(null, groups.get(catB).map(function (p) { return p.order || 0; }));
                if (minA !== minB) return minA - minB;
                return catA.localeCompare(catB, 'fa');
            });

            nav.hidden = categories.length < 2;

            categories.forEach(function (category, index) {
                const sectionId = 'cat-section-' + index;

                /* دکمه ناوبری دسته */
                if (categories.length > 1) {
                    const pill = document.createElement('button');
                    pill.type = 'button';
                    pill.className = 'category-pill';
                    pill.textContent = category;
                    pill.addEventListener('click', function () {
                        document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth', block: 'start' });
                    });
                    navInner.appendChild(pill);
                }

                /* بخش دسته */
                const section = document.createElement('section');
                section.className = 'category-section';
                section.id = sectionId;
                section.dataset.category = category.toLowerCase();

                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML =
                    '<h2><i class="fa-solid fa-layer-group"></i> ' + escapeHtml(category) + '</h2>' +
                    '<span class="category-count">' + groups.get(category).length.toLocaleString('fa-IR') + ' کالا</span>';

                const row = document.createElement('div');
                row.className = 'products-row';

                groups.get(category).forEach(function (product) {
                    row.appendChild(buildProductCard(product));
                });

                section.appendChild(header);
                section.appendChild(row);
                container.appendChild(section);
            });

            if (getCart().length) {
                renderCartPreview(false);
            }
        }


        /* ==========================================
           جستجوی سمت کاربر (فیلتر زنده)
        ========================================== */

        document.getElementById('search-input').addEventListener('input', function () {
            const term = this.value.trim().toLowerCase();

            document.querySelectorAll('.category-section').forEach(function (section) {
                let visibleCount = 0;

                section.querySelectorAll('.product-card').forEach(function (card) {
                    const matches = !term ||
                        card.dataset.title.includes(term) ||
                        card.dataset.category.includes(term);

                    card.style.display = matches ? '' : 'none';
                    if (matches) visibleCount += 1;
                });

                section.style.display = visibleCount ? '' : 'none';
            });
        });


        /* ==========================================
           دریافت محصولات از پنل ادمین (Cloudflare Worker)
        ========================================== */

        fetch(PRODUCTS_API_URL)
            .then(function (res) { return res.json(); })
            .then(function (rep) {
                const products = (rep && rep.ok && Array.isArray(rep.products)) ? rep.products : [];
                renderProducts(products);
            })
            .catch(function (err) {
                console.error(err);
                document.getElementById('products-container').innerHTML =
                    '<div class="loading-text" style="color:#ef4444;">' +
                    '<i class="fa-solid fa-triangle-exclamation"></i> خطا در دریافت لیست محصولات.' +
                    '</div>';
            });


        /* اجرای اولیه */
        updateCartCount();
        if (getCart().length) {
            renderCartPreview(false);
        }

    </script>

    <script>
        (function () {
            fetch('/api/public/pages/products_page')
                .then(function (r) { return r.json(); })
                .then(function (result) {
                    if (!result || !result.ok || !result.fields) return;
                    var data = result.fields;
                    var map = {
                        headerTitle: 'site-products-header-title',
                        headerSubtitle: 'site-products-header-subtitle',
                        sectionTitle: 'site-products-section-title'
                    };
                    Object.keys(map).forEach(function (field) {
                        var value = data[field];
                        var el = document.getElementById(map[field]);
                        if (value && el) el.textContent = value;
                    });
                })
                .catch(function (err) { console.error('site content fetch failed', err); });

            fetch('/api/public/pages/global')
                .then(function (r) { return r.json(); })
                .then(function (result) {
                    var footerEl = document.getElementById('site-footer-text');
                    if (result && result.ok && result.fields && result.fields.footerText && footerEl) {
                        footerEl.textContent = result.fields.footerText;
                    }
                })
                .catch(function (err) { console.error('footer fetch failed', err); });
        })();
    </script>
