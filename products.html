<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لیست محصولات پزشکی | دکتر محمدصادق تاج</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f172a'/%3E%3Cpath d='M50 20c-8 0-14 6-14 14v6h-8v10h8v8c0 8 6 14 14 14s14-6 14-14v-8h8V40h-8v-6c0-8-6-14-14-14z' fill='%2314b8a6'/%3E%3C/svg%3E">


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >


    <!-- Vazirmatn -->

    <link
        href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
        rel="stylesheet"
        type="text/css"
    />


    <style>

        :root {

            --primary-blue: #0284c7;

            --dark-blue: #0f172a;

            --accent-teal: #14b8a6;

            --bg-light: #f8fafc;

            --text-dark: #1e293b;

            --text-muted: #64748b;

            --success: #059669;

            --danger: #ef4444;

        }


        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        body {

            font-family: 'Vazirmatn', Tahoma, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a 0%,
                    #1e293b 100%
                );

            background-attachment: fixed;

            color: #ffffff;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            background:
                rgba(15, 23, 42, 0.75);

            backdrop-filter:
                blur(12px);

            border-bottom:
                1px solid rgba(255, 255, 255, 0.1);

            position:
                sticky;

            top:
                0;

            z-index:
                100;

            padding:
                12px 24px;

        }


        .header-container {

            max-width:
                1000px;

            margin:
                0 auto;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                15px;

        }


        .doctor-info-right {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

        }


        .doctor-info-right i {

            font-size:
                28px;

            color:
                var(--accent-teal);

        }


        .doctor-title-box h1 {

            font-size:
                20px;

            color:
                #ffffff;

            font-weight:
                bold;

        }


        .doctor-title-box span {

            font-size:
                13px;

            color:
                #94a3b8;

            display:
                block;

            margin-top:
                2px;

        }


        /* =========================
           HEADER BUTTONS
        ========================= */

        .header-buttons {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

        }


        .back-btn {

            background:
                rgba(255, 255, 255, 0.08);

            border:
                1px solid rgba(255, 255, 255, 0.15);

            color:
                #ffffff;

            text-decoration:
                none;

            padding:
                8px 14px;

            border-radius:
                8px;

            font-size:
                13px;

            display:
                flex;

            align-items:
                center;

            gap:
                6px;

            transition:
                all 0.3s ease;

            font-family:
                inherit;

        }


        .back-btn:hover {

            background:
                var(--primary-blue);

        }


        /* =========================
           CART BUTTON
        ========================= */

        .cart-btn {

            background:
                rgba(20, 184, 166, 0.15);

            border:
                1px solid rgba(20, 184, 166, 0.4);

            color:
                #5eead4;

            text-decoration:
                none;

            padding:
                8px 14px;

            border-radius:
                8px;

            font-size:
                13px;

            font-weight:
                bold;

            display:
                flex;

            align-items:
                center;

            gap:
                7px;

            transition:
                all 0.3s ease;

            font-family:
                inherit;

            cursor:
                pointer;

        }


        .cart-btn:hover {

            background:
                rgba(20, 184, 166, 0.3);

            transform:
                translateY(-2px);

        }


        /* =========================
           CART COUNT
        ========================= */

        #cart-count {

            min-width:
                20px;

            height:
                20px;

            padding:
                0 5px;

            border-radius:
                50%;

            background:
                #ef4444;

            color:
                #ffffff;

            font-size:
                11px;

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            font-weight:
                bold;

        }


        /* =========================
           MAIN
        ========================= */

        main {

            flex-grow:
                1;

            max-width:
                1000px;

            width:
                100%;

            margin:
                0 auto;

            padding:
                30px 20px 40px 20px;

        }


        /* =========================
           SECTION TITLE
        ========================= */

        .section-title {

            font-size:
                20px;

            margin-bottom:
                25px;

            color:
                var(--accent-teal);

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.1);

            padding-bottom:
                12px;

        }


        .section-title h2 {

            font-size:
                20px;

        }


        /* =========================
           PRODUCTS GRID
        ========================= */

        .products-grid {

            display:
                grid;

            grid-template-columns:
                repeat(auto-fill, minmax(240px, 1fr));

            gap:
                20px;

        }


        /* =========================
           PRODUCT CARD
        ========================= */

        .product-card {

            background:
                rgba(255, 255, 255, 0.05);

            backdrop-filter:
                blur(10px);

            border:
                1px solid rgba(255, 255, 255, 0.1);

            border-radius:
                16px;

            padding:
                16px;

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                space-between;

            transition:
                all 0.3s ease;

            box-shadow:
                0 10px 20px rgba(0, 0, 0, 0.2);

        }


        .product-card:hover {

            border-color:
                rgba(20, 184, 166, 0.5);

            transform:
                translateY(-4px);

        }


        /* =========================
           PRODUCT IMAGE
        ========================= */

        .product-image {

            width:
                100%;

            height:
                180px;

            object-fit:
                cover;

            border-radius:
                10px;

            margin-bottom:
                12px;

            background:
                #0f172a;

        }


        /* =========================
           PRODUCT TITLE
        ========================= */

        .product-title {

            font-size:
                16px;

            font-weight:
                bold;

            color:
                #ffffff;

            margin-bottom:
                8px;

            line-height:
                1.4;

        }


        /* =========================
           PRODUCT DESCRIPTION
        ========================= */

        .product-desc {

            font-size:
                12px;

            color:
                #94a3b8;

            margin-bottom:
                12px;

            line-height:
                1.6;

            flex-grow:
                1;

        }


        /* =========================
           PRICE
        ========================= */

        .product-price {

            font-size:
                15px;

            font-weight:
                bold;

            color:
                var(--accent-teal);

            margin-bottom:
                14px;

        }


        /* =========================
           ORDER BUTTON
        ========================= */

        .order-btn {

            background:
                var(--primary-blue);

            color:
                #ffffff;

            text-align:
                center;

            padding:
                10px;

            border-radius:
                8px;

            font-size:
                13px;

            font-weight:
                bold;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                6px;

            transition:
                all 0.3s;

            cursor:
                pointer;

            border:
                none;

            width:
                100%;

            font-family:
                inherit;

        }


        .order-btn:hover {

            background:
                #0369a1;

            transform:
                translateY(-1px);

        }


        .order-btn.added {

            background:
                #059669;

        }


        /* =========================
           LOADING
        ========================= */

        .loading-text {

            text-align:
                center;

            grid-column:
                1 / -1;

            padding:
                40px;

            color:
                #94a3b8;

            font-size:
                16px;

        }


        /* =====================================================
           CART PREVIEW
        ===================================================== */

        #cart-preview {

            display:
                none;

            margin-top:
                35px;

            background:
                rgba(255, 255, 255, 0.055);

            border:
                1px solid rgba(20, 184, 166, 0.35);

            border-radius:
                18px;

            padding:
                20px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.25);

            animation:
                cartAppear 0.35s ease;

        }


        #cart-preview.show {

            display:
                block;

        }


        @keyframes cartAppear {

            from {

                opacity:
                    0;

                transform:
                    translateY(20px);

            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);

            }

        }


        .cart-preview-header {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                10px;

            margin-bottom:
                18px;

            padding-bottom:
                14px;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.1);

        }


        .cart-preview-title {

            display:
                flex;

            align-items:
                center;

            gap:
                9px;

            color:
                #5eead4;

            font-size:
                18px;

            font-weight:
                bold;

        }


        .cart-preview-title i {

            font-size:
                20px;

        }


        .cart-preview-count {

            color:
                #94a3b8;

            font-size:
                12px;

        }


        /* =========================
           CART ITEMS
        ========================= */

        .cart-items {

            display:
                flex;

            flex-direction:
                column;

            gap:
                12px;

        }


        .cart-item {

            display:
                flex;

            align-items:
                center;

            gap:
                14px;

            padding:
                12px;

            background:
                rgba(15, 23, 42, 0.55);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius:
                12px;

        }


        .cart-item-image {

            width:
                65px;

            height:
                65px;

            object-fit:
                cover;

            border-radius:
                9px;

            background:
                #0f172a;

            flex-shrink:
                0;

        }


        .cart-item-info {

            flex:
                1;

            min-width:
                0;

        }


        .cart-item-name {

            color:
                #ffffff;

            font-size:
                14px;

            font-weight:
                bold;

            margin-bottom:
                5px;

            line-height:
                1.5;

        }


        .cart-item-price {

            color:
                #5eead4;

            font-size:
                12px;

        }


        /* =========================
           QUANTITY
        ========================= */

        .quantity-box {

            display:
                flex;

            align-items:
                center;

            gap:
                6px;

            background:
                rgba(255, 255, 255, 0.06);

            border:
                1px solid rgba(255, 255, 255, 0.1);

            border-radius:
                8px;

            padding:
                3px;

        }


        .quantity-btn {

            width:
                28px;

            height:
                28px;

            border:
                none;

            border-radius:
                6px;

            background:
                rgba(255, 255, 255, 0.08);

            color:
                #ffffff;

            cursor:
                pointer;

            font-family:
                inherit;

            transition:
                all 0.2s;

        }


        .quantity-btn:hover {

            background:
                var(--primary-blue);

        }


        .quantity-number {

            min-width:
                25px;

            text-align:
                center;

            font-size:
                13px;

            font-weight:
                bold;

        }


        /* =========================
           REMOVE
        ========================= */

        .remove-cart-item {

            width:
                32px;

            height:
                32px;

            border:
                none;

            border-radius:
                7px;

            background:
                rgba(239, 68, 68, 0.1);

            color:
                #f87171;

            cursor:
                pointer;

            transition:
                all 0.2s;

        }


        .remove-cart-item:hover {

            background:
                rgba(239, 68, 68, 0.25);

            color:
                #ffffff;

        }


        /* =========================
           CART FOOTER
        ========================= */

        .cart-summary {

            margin-top:
                18px;

            padding-top:
                18px;

            border-top:
                1px solid rgba(255, 255, 255, 0.1);

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                15px;

        }


        .cart-total-label {

            color:
                #94a3b8;

            font-size:
                13px;

        }


        .cart-total-price {

            color:
                #5eead4;

            font-size:
                19px;

            font-weight:
                bold;

            margin-top:
                4px;

        }


        .cart-actions {

            display:
                flex;

            gap:
                10px;

        }


        .continue-shopping-btn,
        .checkout-btn {

            border:
                none;

            border-radius:
                9px;

            padding:
                11px 18px;

            font-family:
                inherit;

            font-size:
                13px;

            font-weight:
                bold;

            cursor:
                pointer;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                7px;

            transition:
                all 0.3s;

        }


        .continue-shopping-btn {

            background:
                rgba(255, 255, 255, 0.08);

            color:
                #ffffff;

            border:
                1px solid rgba(255, 255, 255, 0.12);

        }


        .continue-shopping-btn:hover {

            background:
                rgba(255, 255, 255, 0.14);

        }


        .checkout-btn {

            background:
                var(--primary-blue);

            color:
                #ffffff;

        }


        .checkout-btn:hover {

            background:
                #0369a1;

            transform:
                translateY(-1px);

        }


        /* =========================
           EMPTY CART
        ========================= */

        .empty-cart {

            text-align:
                center;

            padding:
                25px;

            color:
                #94a3b8;

        }


        .empty-cart i {

            font-size:
                35px;

            margin-bottom:
                10px;

            color:
                #64748b;

        }


        .empty-cart p {

            font-size:
                13px;

        }


        /* =========================
           TOAST
        ========================= */

        #toast {

            position:
                fixed;

            bottom:
                25px;

            right:
                50%;

            transform:
                translateX(50%)
                translateY(100px);

            background:
                rgba(15, 23, 42, 0.96);

            border:
                1px solid rgba(20, 184, 166, 0.45);

            color:
                #ffffff;

            padding:
                13px 20px;

            border-radius:
                10px;

            font-size:
                13px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.4);

            opacity:
                0;

            pointer-events:
                none;

            transition:
                all 0.35s ease;

            z-index:
                9999;

        }


        #toast.show {

            opacity:
                1;

            transform:
                translateX(50%)
                translateY(0);

        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            text-align:
                center;

            padding:
                20px;

            font-size:
                13px;

            color:
                #64748b;

            border-top:
                1px solid rgba(255, 255, 255, 0.05);

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            header {

                padding:
                    10px 12px;

            }


            .header-container {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }


            .doctor-info-right {

                justify-content:
                    center;

            }


            .doctor-title-box h1 {

                font-size:
                    17px;

            }


            .header-buttons {

                justify-content:
                    center;

            }


            .back-btn,
            .cart-btn {

                flex:
                    1;

                justify-content:
                    center;

            }


            .cart-item {

                flex-wrap:
                    wrap;

            }


            .cart-item-info {

                min-width:
                    calc(100% - 85px);

            }


            .quantity-box {

                margin-right:
                    79px;

            }


            .remove-cart-item {

                margin-right:
                    auto;

            }


            .cart-summary {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }


            .cart-actions {

                width:
                    100%;

                flex-direction:
                    column;

            }


            .continue-shopping-btn,
            .checkout-btn {

                width:
                    100%;

            }

        }

        /* =========================================================
           THEME REFRESH — brings this page in line with the
           redesigned homepage (gradient accents, depth, glow).
           Appended after the original rules so it takes priority.
        ========================================================= */

        :root {
            --accent-gold: #f59e0b;
            --gradient-primary: linear-gradient(135deg, var(--primary-blue), var(--accent-teal));
        }

        body {
            background: #0b1324;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
        }

        body::before { width: 400px; height: 400px; top: -140px; left: -120px; background: rgba(2, 132, 199, 0.3); }
        body::after { width: 360px; height: 360px; bottom: -160px; right: -100px; background: rgba(20, 184, 166, 0.22); }

        header, main, .cart-preview-wrap { position: relative; z-index: 1; }

        header { padding: 14px 24px; }

        header::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: -1px;
            height: 2px;
            background: var(--gradient-primary);
            opacity: .6;
        }

        .doctor-info-right i { text-shadow: 0 0 18px rgba(20, 184, 166, .5); }

        .doctor-title-box h1 { font-weight: 800; letter-spacing: -0.2px; }
        .doctor-title-box span { color: var(--accent-teal); font-weight: 600; }

        .section-title {
            font-weight: 700;
            color: #ffffff;
            border-bottom: none;
            padding-inline-start: 14px;
            position: relative;
        }

        .section-title::before {
            content: '';
            position: absolute;
            inset-inline-start: 0;
            top: 1px;
            bottom: 1px;
            width: 4px;
            border-radius: 4px;
            background: var(--gradient-primary);
        }

        .section-title i { color: var(--accent-teal); }

        .product-card {
            position: relative;
            overflow: hidden;
            animation: fadeInUp .5s ease-out both;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--gradient-primary);
            opacity: .7;
        }

        .product-card:hover {
            box-shadow: 0 16px 32px rgba(2, 132, 199, 0.22);
        }

        .order-btn {
            background: var(--gradient-primary);
            box-shadow: 0 8px 18px rgba(2, 132, 199, 0.25);
        }

        .order-btn:hover {
            background: var(--gradient-primary);
            filter: brightness(1.08);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(2, 132, 199, 0.35);
        }

        .order-btn.added { background: #059669; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <div class="header-container">


            <div class="doctor-info-right">

                <i class="fa-solid fa-boxes-stacked"></i>

                <div class="doctor-title-box">

                    <h1 id="site-products-header-title">
                        تجهیزات و محصولات پزشکی
                    </h1>

                    <span id="site-products-header-subtitle">
                        دکتر محمدصادق تاج
                    </span>

                </div>

            </div>


            <div class="header-buttons">


                <a
                    href="index.html"
                    class="back-btn"
                >

                    <i class="fa-solid fa-arrow-right"></i>

                    بازگشت به صفحه اصلی

                </a>


                <!--
                    این دکمه دیگر مستقیماً به panel.html نمی‌رود.
                    با کلیک روی آن، سبد خرید پایین صفحه نمایش داده می‌شود.
                -->

                <button
                    type="button"
                    class="cart-btn"
                    id="cart-button"
                >

                    <i class="fa-solid fa-cart-shopping"></i>

                    سبد خرید

                    <span id="cart-count">
                        ۰
                    </span>

                </button>


            </div>

        </div>

    </header>



    <!-- =========================
         MAIN
    ========================= -->

    <main>


        <div class="section-title">

            <i class="fa-solid fa-store"></i>

            <h2 id="site-products-section-title">
                لیست محصولات در دسترس
            </h2>

        </div>


        <!-- محصولات -->

        <div
            id="products-container"
            class="products-grid"
        >

            <div class="loading-text">

                <i class="fa-solid fa-spinner fa-spin"></i>

                در حال دریافت لیست محصولات...

            </div>

        </div>



        <!-- =====================================================
             CART PREVIEW
        ===================================================== -->

        <section
            id="cart-preview"
        >

            <div class="cart-preview-header">

                <div class="cart-preview-title">

                    <i class="fa-solid fa-cart-shopping"></i>

                    سبد خرید شما

                </div>


                <div
                    class="cart-preview-count"
                    id="cart-preview-count"
                >

                    ۰ کالا

                </div>

            </div>


            <div
                class="cart-items"
                id="cart-items"
            ></div>


            <div class="cart-summary">


                <div>

                    <div class="cart-total-label">

                        مبلغ کل سبد خرید

                    </div>

                    <div
                        class="cart-total-price"
                        id="cart-total-price"
                    >

                        ۰ تومان

                    </div>

                </div>


                <div class="cart-actions">


                    <button
                        type="button"
                        class="continue-shopping-btn"
                        id="continue-shopping-btn"
                    >

                        <i class="fa-solid fa-arrow-up"></i>

                        ادامه خرید

                    </button>


                    <button
                        type="button"
                        class="checkout-btn"
                        id="checkout-btn"
                    >

                        ادامه و ثبت سفارش

                        <i class="fa-solid fa-arrow-left"></i>

                    </button>


                </div>


            </div>

        </section>


    </main>



    <!-- =========================
         TOAST
    ========================= -->

    <div id="toast">

        محصول به سبد خرید اضافه شد.

    </div>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer id="site-footer-text">

        © کلیه حقوق برای دکتر محمدصادق تاج محفوظ است.

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        /* ==========================================
           API (پنل ادمین / Cloudflare Worker)
        ========================================== */

        const PRODUCTS_API_URL =
            '/api/public/products';



        /* ==========================================
           CART
        ========================================== */

        const CART_KEY =
            'taj_medical_cart';



        /* ==========================================
           دریافت سبد خرید
        ========================================== */

        function getCart() {

            try {

                return JSON.parse(
                    localStorage.getItem(CART_KEY)
                ) || [];

            } catch (error) {

                console.error(
                    'خطا در خواندن سبد خرید:',
                    error
                );

                return [];

            }

        }



        /* ==========================================
           ذخیره سبد خرید
        ========================================== */

        function saveCart(cart) {

            localStorage.setItem(
                CART_KEY,
                JSON.stringify(cart)
            );

        }



        /* ==========================================
           اضافه کردن محصول
        ========================================== */

        function buyProduct(
            id,
            title,
            price,
            image
        ) {


            const cart =
                getCart();


            const existingProduct =
                cart.find(
                    item => item.id === id
                );


            if (existingProduct) {

                existingProduct.quantity =
                    (Number(existingProduct.quantity) || 1) + 1;

            } else {

                cart.push({

                    id:
                        id,

                    name:
                        title,

                    title:
                        title,

                    price:
                        Number(price) || 0,

                    image:
                        image,

                    quantity:
                        1

                });

            }


            saveCart(cart);


            updateCartCount();


            showToast(
                'محصول «' + title + '» به سبد خرید اضافه شد ✓'
            );


            /* نمایش سبد پایین صفحه */

            renderCartPreview(true);


            /* تغییر ظاهر دکمه */

            const buttons =
                document.querySelectorAll('.order-btn');


            buttons.forEach(function(button) {

                const buttonId =
                    button.getAttribute('data-product-id');


                if (buttonId === id) {

                    button.classList.add('added');

                    button.innerHTML =
                        '<i class="fa-solid fa-check"></i> به سبد اضافه شد';


                    setTimeout(function() {

                        button.classList.remove('added');

                        button.innerHTML =
                            '<i class="fa-solid fa-cart-shopping"></i> خرید محصول';

                    }, 1500);

                }

            });

        }



        /* ==========================================
           تعداد کل محصولات
        ========================================== */

        function getTotalCartCount() {

            const cart =
                getCart();


            return cart.reduce(
                function(total, item) {

                    return total +
                        (Number(item.quantity) || 1);

                },
                0
            );

        }



        /* ==========================================
           بروزرسانی تعداد سبد
        ========================================== */

        function updateCartCount() {

            const totalCount =
                getTotalCartCount();


            const cartCount =
                document.getElementById(
                    'cart-count'
                );


            if (cartCount) {

                cartCount.textContent =
                    totalCount.toLocaleString('fa-IR');

            }

        }



        /* ==========================================
           فرمت قیمت
        ========================================== */

        function formatPrice(price) {

            return Number(price || 0)
                .toLocaleString('fa-IR') +
                ' تومان';

        }



        /* ==========================================
           محاسبه مبلغ کل
        ========================================== */

        function getCartTotal() {

            const cart =
                getCart();


            return cart.reduce(
                function(total, item) {

                    const price =
                        Number(item.price) || 0;


                    const quantity =
                        Number(item.quantity) || 1;


                    return total +
                        (price * quantity);

                },
                0
            );

        }



        /* ==========================================
           نمایش سبد خرید پایین صفحه
        ========================================== */

        function renderCartPreview(
            shouldScroll
        ) {


            const cart =
                getCart();


            const preview =
                document.getElementById(
                    'cart-preview'
                );


            const itemsContainer =
                document.getElementById(
                    'cart-items'
                );


            const countElement =
                document.getElementById(
                    'cart-preview-count'
                );


            const totalElement =
                document.getElementById(
                    'cart-total-price'
                );


            const totalCount =
                getTotalCartCount();


            /* تعداد */

            countElement.textContent =
                totalCount.toLocaleString('fa-IR') +
                ' کالا';


            /* مبلغ کل */

            totalElement.textContent =
                formatPrice(
                    getCartTotal()
                );


            /* سبد خالی */

            if (!cart.length) {

                itemsContainer.innerHTML =

                    '<div class="empty-cart">' +

                        '<i class="fa-solid fa-cart-shopping"></i>' +

                        '<p>سبد خرید شما خالی است.</p>' +

                    '</div>';


                preview.classList.remove('show');

                return;

            }


            preview.classList.add('show');


            itemsContainer.innerHTML = '';


            /* ساخت آیتم‌ها */

            cart.forEach(
                function(item, index) {


                    const quantity =
                        Number(item.quantity) || 1;


                    const price =
                        Number(item.price) || 0;


                    const itemTotal =
                        price * quantity;


                    const itemElement =
                        document.createElement('div');


                    itemElement.className =
                        'cart-item';


                    itemElement.innerHTML =

                        '<img ' +

                            'src="' +
                            escapeHtml(item.image || '') +
                            '" ' +

                            'class="cart-item-image" ' +

                            'alt="' +
                            escapeHtml(item.title || item.name || 'محصول') +
                            '"' +

                        '>' +


                        '<div class="cart-item-info">' +

                            '<div class="cart-item-name">' +

                                escapeHtml(
                                    item.title ||
                                    item.name ||
                                    'محصول پزشکی'
                                ) +

                            '</div>' +


                            '<div class="cart-item-price">' +

                                formatPrice(itemTotal) +

                            '</div>' +

                        '</div>' +


                        '<div class="quantity-box">' +

                            '<button ' +

                                'type="button" ' +

                                'class="quantity-btn decrease-btn" ' +

                                'data-index="' +
                                index +
                                '"' +

                            '>' +

                                '<i class="fa-solid fa-minus"></i>' +

                            '</button>' +


                            '<span class="quantity-number">' +

                                quantity.toLocaleString('fa-IR') +

                            '</span>' +


                            '<button ' +

                                'type="button" ' +

                                'class="quantity-btn increase-btn" ' +

                                'data-index="' +
                                index +
                                '"' +

                            '>' +

                                '<i class="fa-solid fa-plus"></i>' +

                            '</button>' +

                        '</div>' +


                        '<button ' +

                            'type="button" ' +

                            'class="remove-cart-item" ' +

                            'data-index="' +
                            index +
                            '"' +

                            'title="حذف محصول"' +

                        '>' +

                            '<i class="fa-solid fa-trash"></i>' +

                        '</button>';


                    itemsContainer.appendChild(
                        itemElement
                    );

                }
            );


            /* رویداد کاهش تعداد */

            document
                .querySelectorAll('.decrease-btn')
                .forEach(function(button) {

                    button.addEventListener(
                        'click',
                        function() {

                            const index =
                                Number(
                                    this.getAttribute(
                                        'data-index'
                                    )
                                );


                            changeQuantity(
                                index,
                                -1
                            );

                        }
                    );

                });


            /* رویداد افزایش تعداد */

            document
                .querySelectorAll('.increase-btn')
                .forEach(function(button) {

                    button.addEventListener(
                        'click',
                        function() {

                            const index =
                                Number(
                                    this.getAttribute(
                                        'data-index'
                                    )
                                );


                            changeQuantity(
                                index,
                                1
                            );

                        }
                    );

                });


            /* رویداد حذف */

            document
                .querySelectorAll('.remove-cart-item')
                .forEach(function(button) {

                    button.addEventListener(
                        'click',
                        function() {

                            const index =
                                Number(
                                    this.getAttribute(
                                        'data-index'
                                    )
                                );


                            removeCartItem(
                                index
                            );

                        }
                    );

                });


            /* اسکرول به سبد */

            if (shouldScroll) {

                setTimeout(function() {

                    preview.scrollIntoView({

                        behavior:
                            'smooth',

                        block:
                            'center'

                    });

                }, 80);

            }

        }



        /* ==========================================
           تغییر تعداد
        ========================================== */

        function changeQuantity(
            index,
            change
        ) {


            const cart =
                getCart();


            if (!cart[index]) {

                return;

            }


            cart[index].quantity =
                (Number(cart[index].quantity) || 1) +
                change;


            if (cart[index].quantity <= 0) {

                cart.splice(
                    index,
                    1
                );

            }


            saveCart(cart);


            updateCartCount();


            renderCartPreview(false);

        }



        /* ==========================================
           حذف محصول
        ========================================== */

        function removeCartItem(index) {


            const cart =
                getCart();


            if (!cart[index]) {

                return;

            }


            const title =
                cart[index].title ||
                cart[index].name ||
                'محصول';


            cart.splice(
                index,
                1
            );


            saveCart(cart);


            updateCartCount();


            renderCartPreview(false);


            showToast(
                '«' + title + '» از سبد خرید حذف شد'
            );

        }



        /* ==========================================
           باز کردن سبد از هدر
        ========================================== */

        document
            .getElementById('cart-button')
            .addEventListener(
                'click',
                function() {

                    const cart =
                        getCart();


                    if (!cart.length) {

                        showToast(
                            'سبد خرید شما خالی است'
                        );

                        return;

                    }


                    renderCartPreview(true);

                }
            );



        /* ==========================================
           ادامه خرید
        ========================================== */

        document
            .getElementById('continue-shopping-btn')
            .addEventListener(
                'click',
                function() {

                    const products =
                        document.getElementById(
                            'products-container'
                        );


                    products.scrollIntoView({

                        behavior:
                            'smooth',

                        block:
                            'start'

                    });

                }
            );



        /* ==========================================
           رفتن به پنل برای ثبت سفارش
        ========================================== */

        document
            .getElementById('checkout-btn')
            .addEventListener(
                'click',
                function() {

                    const cart =
                        getCart();


                    if (!cart.length) {

                        showToast(
                            'سبد خرید شما خالی است'
                        );

                        return;

                    }


                    /*
                     * همان سبد خرید فعلی در localStorage
                     * حفظ می‌شود و پنل آن را می‌خواند.
                     */

                    window.location.href =
                        'panel.html';

                }
            );



        /* ==========================================
           جلوگیری از HTML ناخواسته
        ========================================== */

        function escapeHtml(value) {

            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }



        /* ==========================================
           نمایش پیام
        ========================================== */

        function showToast(message) {


            const toast =
                document.getElementById(
                    'toast'
                );


            toast.textContent =
                message;


            toast.classList.add(
                'show'
            );


            setTimeout(function() {

                toast.classList.remove(
                    'show'
                );

            }, 2200);

        }



        /* ==========================================
           دریافت محصولات از پنل ادمین (Cloudflare Worker)
        ========================================== */

        fetch(PRODUCTS_API_URL)

            .then(function(res) {

                return res.json();

            })


            .then(function(rep) {


                var products =
                    (rep && rep.ok && Array.isArray(rep.products))
                    ?
                    rep.products
                    :
                    [];


                var container =
                    document.getElementById(
                        'products-container'
                    );


                container.innerHTML = '';



                if (!products.length) {

                    container.innerHTML =

                        '<div class="loading-text">' +

                        'هیچ محصولی ثبت نشده است.' +

                        '</div>';

                    return;

                }



                /* ==========================================
                   ساخت کارت محصولات
                ========================================== */

                products.forEach(function(product) {


                    /* نام محصول */

                    var title =
                        product.title
                        ?
                        String(product.title)
                        :
                        'دستگاه پزشکی';



                    /* توضیحات */

                    var desc =
                        product.description
                        ?
                        String(product.description)
                        :
                        '';



                    /* قیمت */

                    var price =
                        (
                            product.price !== undefined &&
                            product.price !== null
                        )
                        ?
                        product.price
                        :
                        0;



                    /* تصویر */

                    var image =
                        product.imageUrl
                        ?
                        String(product.imageUrl)
                        :
                        'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20300%20200%22%3E%3Crect%20width%3D%22300%22%20height%3D%22200%22%20fill%3D%22%230f172a%22/%3E%3Crect%20x%3D%22110%22%20y%3D%2270%22%20width%3D%2280%22%20height%3D%2260%22%20rx%3D%228%22%20fill%3D%22none%22%20stroke%3D%22%2314b8a6%22%20stroke-width%3D%225%22/%3E%3Cpath%20d%3D%22M135%2070v-15a15%2015%200%200130%200v15%22%20fill%3D%22none%22%20stroke%3D%22%2314b8a6%22%20stroke-width%3D%225%22/%3E%3C/svg%3E';



                    /* شناسه */

                    var productId =
                        String(product.id);



                    /* قیمت نمایش */

                    var formattedPrice;


                    if (
                        typeof price === 'number' &&
                        !isNaN(price)
                    ) {

                        formattedPrice =
                            price.toLocaleString('fa-IR') +
                            ' تومان';

                    } else {

                        formattedPrice =
                            String(price);

                    }



                    /* کارت */

                    var card =
                        document.createElement('div');


                    card.className =
                        'product-card';



                    /* تصویر */

                    var img =
                        document.createElement('img');


                    img.src =
                        image;


                    img.alt =
                        title;


                    img.className =
                        'product-image';


                    img.onerror =
                        function() {

                            this.src =
                                'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20300%20200%22%3E%3Crect%20width%3D%22300%22%20height%3D%22200%22%20fill%3D%22%230f172a%22/%3E%3Crect%20x%3D%22110%22%20y%3D%2270%22%20width%3D%2280%22%20height%3D%2260%22%20rx%3D%228%22%20fill%3D%22none%22%20stroke%3D%22%2314b8a6%22%20stroke-width%3D%225%22/%3E%3Cpath%20d%3D%22M135%2070v-15a15%2015%200%200130%200v15%22%20fill%3D%22none%22%20stroke%3D%22%2314b8a6%22%20stroke-width%3D%225%22/%3E%3C/svg%3E';

                        };



                    /* عنوان */

                    var titleElement =
                        document.createElement('div');


                    titleElement.className =
                        'product-title';


                    titleElement.textContent =
                        title;



                    /* توضیحات */

                    var descElement =
                        document.createElement('div');


                    descElement.className =
                        'product-desc';


                    descElement.textContent =
                        desc;



                    /* قیمت */

                    var priceElement =
                        document.createElement('div');


                    priceElement.className =
                        'product-price';


                    priceElement.textContent =
                        formattedPrice;



                    /* دکمه */

                    var button =
                        document.createElement('button');


                    button.className =
                        'order-btn';


                    button.setAttribute(
                        'data-product-id',
                        productId
                    );


                    button.innerHTML =
                        '<i class="fa-solid fa-cart-shopping"></i> خرید محصول';



                    /* کلیک */

                    button.addEventListener(
                        'click',
                        function() {


                            var numericPrice =
                                parseFloat(price);


                            if (
                                isNaN(numericPrice)
                            ) {

                                numericPrice =
                                    0;

                            }


                            buyProduct(
                                productId,
                                title,
                                numericPrice,
                                image
                            );

                        }
                    );



                    /* ساخت کارت */

                    card.appendChild(
                        img
                    );


                    card.appendChild(
                        titleElement
                    );


                    if (desc) {

                        card.appendChild(
                            descElement
                        );

                    }


                    card.appendChild(
                        priceElement
                    );


                    card.appendChild(
                        button
                    );


                    container.appendChild(
                        card
                    );

                });


                /*
                 * اگر از قبل چیزی در سبد بوده،
                 * سبد پایین صفحه را هم آماده می‌کنیم
                 * ولی خودکار صفحه را پایین نمی‌بریم.
                 */

                if (getCart().length) {

                    renderCartPreview(false);

                }

            })


            /* ==========================================
               خطا
            ========================================== */

            .catch(function(err) {


                console.error(err);


                document.getElementById(
                    'products-container'
                ).innerHTML =

                    '<div class="loading-text" style="color:#ef4444;">' +

                    '<i class="fa-solid fa-triangle-exclamation"></i> ' +

                    'خطا در دریافت لیست محصولات.' +

                    '</div>';

            });



        /* ==========================================
           اجرای اولیه
        ========================================== */

        updateCartCount();


        /*
         * اگر کاربر قبلاً محصولی انتخاب کرده باشد،
         * سبد در پایین صفحه نمایش داده می‌شود.
         */

        if (getCart().length) {

            renderCartPreview(false);

        }


    </script>

    <script>
        (function () {
            fetch('/api/public/pages/products_page')
                .then(function (r) { return r.json(); })
                .then(function (result) {
                    if (!result || !result.ok || !result.fields) return;
                    var data = result.fields;
                    var map = {
                        headerTitle: 'site-products-header-title',
                        headerSubtitle: 'site-products-header-subtitle',
                        sectionTitle: 'site-products-section-title'
                    };
                    Object.keys(map).forEach(function (field) {
                        var value = data[field];
                        var el = document.getElementById(map[field]);
                        if (value && el) el.textContent = value;
                    });
                })
                .catch(function (err) { console.error('site content fetch failed', err); });

            fetch('/api/public/pages/global')
                .then(function (r) { return r.json(); })
                .then(function (result) {
                    var footerEl = document.getElementById('site-footer-text');
                    if (result && result.ok && result.fields && result.fields.footerText && footerEl) {
                        footerEl.textContent = result.fields.footerText;
                    }
                })
                .catch(function (err) { console.error('footer fetch failed', err); });
        })();
    </script>

</body>

</html>
