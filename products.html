<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت محصولات | پنل ادمین</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="shared.css">

<style>

    .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
    }

    .post-list { display: flex; flex-direction: column; gap: 12px; }

    .post-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 16px 18px;
        display: flex;
        gap: 14px;
        align-items: flex-start;
        flex-wrap: wrap;
    }

    .post-card-main { flex: 1 1 260px; min-width: 0; display: flex; gap: 14px; align-items: center; }

    .product-thumb {
        width: 64px;
        height: 64px;
        border-radius: 10px;
        object-fit: cover;
        background: rgba(255,255,255,.06);
        border: 1px solid var(--border-color);
        flex-shrink: 0;
    }

    .post-card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }

    .badge {
        font-size: 11px;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        white-space: nowrap;
    }

    .badge.published { color: #86efac; border-color: rgba(34, 197, 94, .35); background: rgba(34, 197, 94, .1); }
    .badge.draft { color: #fcd34d; border-color: rgba(245, 158, 11, .35); background: rgba(245, 158, 11, .1); }

    .post-card-title { font-size: 15.5px; font-weight: 700; margin: 0 0 4px; }
    .post-card-meta { font-size: 12px; color: var(--text-muted); }
    .post-card-summary { font-size: 13px; color: var(--text-muted); margin-top: 4px; line-height: 1.8; }

    .post-card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .post-card-actions .icon-btn { padding: 8px 12px; font-size: 12.5px; }

    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .55);
        backdrop-filter: blur(3px);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 30px 16px;
        overflow-y: auto;
        z-index: 50;
    }

    .modal-box {
        width: min(560px, 100%);
        background: #111c34;
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 24px;
    }

    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .modal-head h3 { margin: 0; font-size: 17px; }
    .modal-close { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 560px) { .row-2 { grid-template-columns: 1fr; } }

    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }

    .img-preview {
        margin-top: 8px;
        max-width: 100%;
        max-height: 140px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
        display: none;
    }

    .switch-field { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .switch-field label { margin: 0; }

    .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: #111c34;
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 13px 20px;
        font-size: 13.5px;
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s, transform .2s;
        z-index: 100;
        max-width: 90%;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: rgba(34, 197, 94, .4); }
    .toast.error { border-color: rgba(239, 68, 68, .4); }

    [hidden] { display: none !important; }

</style>
</head>

<body>

<div class="page-container">

    <div class="top-header">
        <div class="header-title">
            <h1>مدیریت محصولات</h1>
            <p>محصولاتی که در صفحه «لیست محصولات پزشکی» سایت نمایش داده می‌شوند</p>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="logoutBtn" hidden><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
        </div>
    </div>

    <div class="nav-bar" id="navBar" hidden></div>

    <!-- Checking access -->
    <section id="loading" class="status-box">
        <i class="fa-solid fa-spinner fa-spin"></i>
        در حال بررسی دسترسی...
    </section>

    <!-- Not logged in -->
    <section id="loginSection" hidden>
        <div class="login-card">
            <h2>ورود مدیر</h2>
            <div class="form-error" id="loginError"></div>
            <form id="loginForm">
                <div class="field">
                    <label>ایمیل</label>
                    <input type="email" id="loginEmail" required autocomplete="username">
                </div>
                <div class="field">
                    <label>رمز عبور</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password">
                </div>
                <button type="submit" class="icon-btn btn-primary" style="width:100%;justify-content:center" id="loginSubmit">
                    ورود
                </button>
            </form>
        </div>
    </section>

    <!-- Logged in but no products permission -->
    <section id="deniedSection" hidden class="status-box error">
        <i class="fa-solid fa-lock"></i>
        <div id="deniedText">شما دسترسی مدیریت محصولات را ندارید.</div>
    </section>

    <!-- Main app -->
    <section id="app" hidden>

        <div class="toolbar">
            <div id="listMeta" style="color:var(--text-muted);font-size:13px;"></div>
            <button class="icon-btn btn-primary" id="addBtn" hidden>
                <i class="fa-solid fa-plus"></i> افزودن محصول جدید
            </button>
        </div>

        <div id="listStatus" class="status-box" hidden></div>
        <div class="post-list" id="productList"></div>

    </section>

</div>

<!-- Add/Edit modal -->
<div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal-box">
        <div class="modal-head">
            <h3 id="modalTitle">افزودن محصول</h3>
            <button class="modal-close" id="modalClose"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="form-error" id="formError"></div>

        <form id="productForm">
            <div class="field">
                <label>نام محصول *</label>
                <input type="text" id="fTitle" maxlength="200" required>
            </div>

            <div class="row-2">
                <div class="field">
                    <label>قیمت (تومان) *</label>
                    <input type="number" id="fPrice" min="0" step="1" required>
                </div>
                <div class="field">
                    <label>ترتیب نمایش</label>
                    <input type="number" id="fOrder" step="1" value="0">
                    <div class="hint">عدد کوچک‌تر، بالاتر نمایش داده می‌شود.</div>
                </div>
            </div>

            <div class="field">
                <label>توضیحات</label>
                <textarea id="fDescription" maxlength="2000" style="min-height:80px"></textarea>
            </div>

            <div class="field">
                <label>آدرس تصویر (اختیاری)</label>
                <input type="url" id="fImageUrl" placeholder="https://...">
                <div class="hint">فقط لینک‌های https:// پذیرفته می‌شود.</div>
                <img id="fImagePreview" class="img-preview">
            </div>

            <div class="field switch-field">
                <label>نمایش در سایت (فعال)</label>
                <input type="checkbox" id="fActive" style="width:auto;">
            </div>

            <div class="modal-actions">
                <button type="button" class="icon-btn" id="cancelBtn">انصراف</button>
                <button type="submit" class="icon-btn btn-primary" id="submitBtn">ذخیره</button>
            </div>
        </form>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">

import {
    readSession, saveSession, apiFetch, friendlyError, showToast,
    escapeHtml, renderNav
} from "./shared.js";

const el = (id) => document.getElementById(id);

const state = {
    permissions: [],
    isSuper: false,
    products: [],
    editingId: null,
};

function can(action) {
    return state.permissions.includes(`products.${action}`);
}

function formatPrice(value) {
    const num = Number(value) || 0;
    return num.toLocaleString("fa-IR") + " تومان";
}

/* =========================================================
   Boot / auth gate
========================================================= */

async function boot() {
    const session = readSession();

    if (!session?.idToken) {
        el("loading").hidden = true;
        el("loginSection").hidden = false;
        return;
    }

    try {
        const me = await apiFetch("/admin/me");
        state.permissions = me.permissions || [];
        state.isSuper = !!me.isSuper;

        el("navBar").hidden = false;
        renderNav("products", state.isSuper);

        if (!can("view")) {
            el("loading").hidden = true;
            el("deniedText").textContent = "حساب شما به بخش محصولات دسترسی ندارد.";
            el("deniedSection").hidden = false;
            el("logoutBtn").hidden = false;
            return;
        }

        el("logoutBtn").hidden = false;
        el("loading").hidden = true;
        el("app").hidden = false;

        el("addBtn").hidden = !can("add");

        await loadProducts();

    } catch (error) {
        el("loading").hidden = true;

        if (error.status === 401) {
            saveSession(null);
            el("loginSection").hidden = false;
            return;
        }

        el("deniedText").textContent = friendlyError(error);
        el("deniedSection").hidden = false;
        el("logoutBtn").hidden = false;
    }
}

el("logoutBtn").addEventListener("click", () => {
    saveSession(null);
    location.reload();
});

/* ---------- login ---------- */

el("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const errBox = el("loginError");
    errBox.classList.remove("show");

    const email = el("loginEmail").value.trim();
    const password = el("loginPassword").value;
    const btn = el("loginSubmit");

    btn.disabled = true;
    btn.textContent = "در حال ورود...";

    try {
        const result = await apiFetch("/auth/login", {
            method: "POST",
            body: JSON.stringify({ email, password }),
        }, false);

        saveSession({
            idToken: result.idToken,
            refreshToken: result.refreshToken,
            expiresIn: result.expiresIn,
            user: result.user,
        });

        location.reload();

    } catch (error) {
        errBox.textContent = friendlyError(error);
        errBox.classList.add("show");
    } finally {
        btn.disabled = false;
        btn.textContent = "ورود";
    }
});

/* =========================================================
   Load / render list
========================================================= */

async function loadProducts() {
    const listStatus = el("listStatus");
    const listMeta = el("listMeta");
    const list = el("productList");

    list.innerHTML = "";
    listStatus.hidden = false;
    listStatus.className = "status-box";
    listStatus.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال بارگذاری...';
    listMeta.textContent = "";

    try {
        const result = await apiFetch("/admin/products");
        state.products = result.products || [];

        listStatus.hidden = true;
        listMeta.textContent = `${state.products.length} محصول`;

        if (!state.products.length) {
            listStatus.hidden = false;
            listStatus.innerHTML = '<i class="fa-solid fa-inbox"></i> هنوز محصولی ثبت نشده است.';
            return;
        }

        renderProducts();

    } catch (error) {
        listStatus.className = "status-box error";
        listStatus.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${escapeHtml(friendlyError(error))}`;
    }
}

function renderProducts() {
    const list = el("productList");
    list.innerHTML = "";

    const sorted = state.products.slice().sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));

    for (const product of sorted) {
        const card = document.createElement("div");
        card.className = "post-card";

        const statusBadge = product.active === false
            ? `<span class="badge draft">مخفی</span>`
            : `<span class="badge published">نمایش در سایت</span>`;

        const thumb = product.imageUrl
            ? `<img class="product-thumb" src="${escapeHtml(product.imageUrl)}" alt="" onerror="this.style.visibility='hidden'">`
            : `<div class="product-thumb"></div>`;

        card.innerHTML = `
            <div class="post-card-main">
                ${thumb}
                <div>
                    <div class="post-card-head">${statusBadge}</div>
                    <h3 class="post-card-title">${escapeHtml(product.title)}</h3>
                    <div class="post-card-meta">${formatPrice(product.price)} · ترتیب ${escapeHtml(String(product.order ?? 0))}</div>
                    ${product.description ? `<div class="post-card-summary">${escapeHtml(product.description)}</div>` : ""}
                </div>
            </div>
            <div class="post-card-actions"></div>
        `;

        const actions = card.querySelector(".post-card-actions");

        if (can("edit")) {
            const editBtn = document.createElement("button");
            editBtn.className = "icon-btn";
            editBtn.innerHTML = '<i class="fa-solid fa-pen"></i> ویرایش';
            editBtn.addEventListener("click", () => openForm(product));
            actions.appendChild(editBtn);
        }

        if (can("delete")) {
            const delBtn = document.createElement("button");
            delBtn.className = "icon-btn btn-danger";
            delBtn.innerHTML = '<i class="fa-solid fa-trash"></i> حذف';
            delBtn.addEventListener("click", () => deleteProduct(product));
            actions.appendChild(delBtn);
        }

        list.appendChild(card);
    }
}

/* =========================================================
   Delete
========================================================= */

async function deleteProduct(product) {
    if (!confirm(`محصول «${product.title}» حذف شود؟ این کار قابل بازگشت نیست.`)) return;

    try {
        await apiFetch(`/admin/products/${encodeURIComponent(product.id)}`, { method: "DELETE" });
        showToast("محصول حذف شد.");
        await loadProducts();
    } catch (error) {
        showToast(friendlyError(error), "error");
    }
}

/* =========================================================
   Add / edit form
========================================================= */

el("addBtn").addEventListener("click", () => openForm(null));
el("modalClose").addEventListener("click", closeForm);
el("cancelBtn").addEventListener("click", closeForm);

el("fImageUrl").addEventListener("input", () => {
    const url = el("fImageUrl").value.trim();
    const preview = el("fImagePreview");

    if (/^https:\/\//i.test(url)) {
        preview.src = url;
        preview.style.display = "block";
        preview.onerror = () => { preview.style.display = "none"; };
    } else {
        preview.style.display = "none";
    }
});

function openForm(product) {
    state.editingId = product ? product.id : null;

    el("modalTitle").textContent = product ? "ویرایش محصول" : "افزودن محصول";
    el("formError").classList.remove("show");

    el("fTitle").value = product?.title || "";
    el("fPrice").value = product?.price ?? "";
    el("fOrder").value = product?.order ?? 0;
    el("fDescription").value = product?.description || "";
    el("fImageUrl").value = product?.imageUrl || "";
    el("fActive").checked = product ? product.active !== false : true;

    const preview = el("fImagePreview");
    if (product?.imageUrl) {
        preview.src = product.imageUrl;
        preview.style.display = "block";
    } else {
        preview.style.display = "none";
    }

    el("modalOverlay").hidden = false;
    el("fTitle").focus();
}

function closeForm() {
    el("modalOverlay").hidden = true;
}

el("productForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const errBox = el("formError");
    errBox.classList.remove("show");

    const title = el("fTitle").value.trim();
    const price = el("fPrice").value;
    const imageUrl = el("fImageUrl").value.trim();

    if (!title || price === "") {
        errBox.textContent = "نام و قیمت محصول الزامی هستند.";
        errBox.classList.add("show");
        return;
    }

    if (imageUrl && !/^https:\/\//i.test(imageUrl)) {
        errBox.textContent = "آدرس تصویر باید با https:// شروع شود.";
        errBox.classList.add("show");
        return;
    }

    const payload = {
        title,
        price: Number(price),
        order: Number(el("fOrder").value || 0),
        description: el("fDescription").value.trim(),
        imageUrl: imageUrl || null,
        active: el("fActive").checked,
    };

    const submitBtn = el("submitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "در حال ذخیره...";

    try {
        if (state.editingId) {
            await apiFetch(`/admin/products/${encodeURIComponent(state.editingId)}`, {
                method: "PUT",
                body: JSON.stringify(payload),
            });
            showToast("محصول به‌روزرسانی شد.");
        } else {
            await apiFetch("/admin/products", {
                method: "POST",
                body: JSON.stringify(payload),
            });
            showToast("محصول افزوده شد.");
        }

        closeForm();
        await loadProducts();

    } catch (error) {
        errBox.textContent = friendlyError(error);
        errBox.classList.add("show");
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "ذخیره";
    }
});

boot();

</script>

</body>
</html>
