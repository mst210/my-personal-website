<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لیست محصولات پزشکی | دکتر محمدصادق تاج</title>


    <!-- Font Awesome Icons -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >


    <!-- Vazirmatn Font -->

    <link
        href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
        rel="stylesheet"
        type="text/css"
    />


    <style>

        :root {

            --primary-blue: #0284c7;

            --dark-blue: #0f172a;

            --accent-teal: #14b8a6;

            --bg-light: #f8fafc;

            --text-dark: #1e293b;

            --text-muted: #64748b;

        }


        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        body {

            font-family: 'Vazirmatn', Tahoma, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a 0%,
                    #1e293b 100%
                );

            background-attachment: fixed;

            color: #ffffff;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            background:
                rgba(15, 23, 42, 0.75);

            backdrop-filter: blur(12px);

            border-bottom:
                1px solid rgba(255, 255, 255, 0.1);

            position: sticky;

            top: 0;

            z-index: 100;

            padding: 12px 24px;

        }


        .header-container {

            max-width: 1000px;

            margin: 0 auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

        }


        .doctor-info-right {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .doctor-info-right i {

            font-size: 28px;

            color:
                var(--accent-teal);

        }


        .doctor-title-box h1 {

            font-size: 20px;

            color: #ffffff;

            font-weight: bold;

        }


        .doctor-title-box span {

            font-size: 13px;

            color: #94a3b8;

            display: block;

            margin-top: 2px;

        }


        /* =========================
           HEADER BUTTONS
        ========================= */

        .header-buttons {

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .back-btn {

            background:
                rgba(255, 255, 255, 0.08);

            border:
                1px solid rgba(255, 255, 255, 0.15);

            color: #ffffff;

            text-decoration: none;

            padding: 8px 14px;

            border-radius: 8px;

            font-size: 13px;

            display: flex;

            align-items: center;

            gap: 6px;

            transition: all 0.3s ease;

            font-family: inherit;

        }


        .back-btn:hover {

            background:
                var(--primary-blue);

        }


        /* =========================
           CART BUTTON
        ========================= */

        .cart-btn {

            background:
                rgba(20, 184, 166, 0.15);

            border:
                1px solid rgba(20, 184, 166, 0.4);

            color:
                #5eead4;

            text-decoration: none;

            padding: 8px 14px;

            border-radius: 8px;

            font-size: 13px;

            font-weight: bold;

            display: flex;

            align-items: center;

            gap: 7px;

            transition: all 0.3s ease;

            font-family: inherit;

        }


        .cart-btn:hover {

            background:
                rgba(20, 184, 166, 0.3);

            transform:
                translateY(-2px);

        }


        /* =========================
           CART COUNT
        ========================= */

        #cart-count {

            min-width: 20px;

            height: 20px;

            padding: 0 5px;

            border-radius: 50%;

            background:
                #ef4444;

            color:
                #ffffff;

            font-size: 11px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            font-weight: bold;

        }


        /* =========================
           MAIN
        ========================= */

        main {

            flex-grow: 1;

            max-width: 1000px;

            width: 100%;

            margin: 0 auto;

            padding:
                30px 20px 40px 20px;

        }


        /* =========================
           SECTION TITLE
        ========================= */

        .section-title {

            font-size: 20px;

            margin-bottom: 25px;

            color:
                var(--accent-teal);

            display: flex;

            align-items: center;

            gap: 10px;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.1);

            padding-bottom: 12px;

        }


        /* =========================
           PRODUCTS GRID
        ========================= */

        .products-grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(240px, 1fr));

            gap: 20px;

        }


        /* =========================
           PRODUCT CARD
        ========================= */

        .product-card {

            background:
                rgba(255, 255, 255, 0.05);

            backdrop-filter:
                blur(10px);

            border:
                1px solid rgba(255, 255, 255, 0.1);

            border-radius:
                16px;

            padding:
                16px;

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                space-between;

            transition:
                all 0.3s ease;

            box-shadow:
                0 10px 20px rgba(0, 0, 0, 0.2);

        }


        .product-card:hover {

            border-color:
                rgba(20, 184, 166, 0.5);

            transform:
                translateY(-4px);

        }


        /* =========================
           PRODUCT IMAGE
        ========================= */

        .product-image {

            width: 100%;

            height: 180px;

            object-fit: cover;

            border-radius: 10px;

            margin-bottom: 12px;

            background:
                #0f172a;

        }


        /* =========================
           PRODUCT TITLE
        ========================= */

        .product-title {

            font-size: 16px;

            font-weight: bold;

            color: #ffffff;

            margin-bottom: 8px;

            line-height: 1.4;

        }


        /* =========================
           PRODUCT DESCRIPTION
        ========================= */

        .product-desc {

            font-size: 12px;

            color: #94a3b8;

            margin-bottom: 12px;

            line-height: 1.6;

            flex-grow: 1;

        }


        /* =========================
           PRICE
        ========================= */

        .product-price {

            font-size: 15px;

            font-weight: bold;

            color:
                var(--accent-teal);

            margin-bottom: 14px;

        }


        /* =========================
           ORDER BUTTON
        ========================= */

        .order-btn {

            background:
                var(--primary-blue);

            color:
                #ffffff;

            text-align:
                center;

            padding:
                10px;

            border-radius:
                8px;

            font-size:
                13px;

            font-weight:
                bold;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                6px;

            transition:
                all 0.3s;

            cursor:
                pointer;

            border:
                none;

            width:
                100%;

            font-family:
                inherit;

        }


        .order-btn:hover {

            background:
                #0369a1;

            transform:
                translateY(-1px);

        }


        .order-btn.added {

            background:
                #059669;

        }


        /* =========================
           LOADING
        ========================= */

        .loading-text {

            text-align:
                center;

            grid-column:
                1 / -1;

            padding:
                40px;

            color:
                #94a3b8;

            font-size:
                16px;

        }


        /* =========================
           TOAST
        ========================= */

        #toast {

            position:
                fixed;

            bottom:
                25px;

            right:
                50%;

            transform:
                translateX(50%)
                translateY(100px);

            background:
                rgba(15, 23, 42, 0.96);

            border:
                1px solid rgba(20, 184, 166, 0.45);

            color:
                #ffffff;

            padding:
                13px 20px;

            border-radius:
                10px;

            font-size:
                13px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.4);

            opacity:
                0;

            pointer-events:
                none;

            transition:
                all 0.35s ease;

            z-index:
                9999;

        }


        #toast.show {

            opacity:
                1;

            transform:
                translateX(50%)
                translateY(0);

        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            text-align:
                center;

            padding:
                20px;

            font-size:
                13px;

            color:
                #64748b;

            border-top:
                1px solid rgba(255, 255, 255, 0.05);

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            header {

                padding:
                    10px 12px;

            }


            .header-container {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }


            .doctor-info-right {

                justify-content:
                    center;

            }


            .doctor-title-box h1 {

                font-size:
                    17px;

            }


            .header-buttons {

                justify-content:
                    center;

            }


            .back-btn,
            .cart-btn {

                flex:
                    1;

                justify-content:
                    center;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <div class="header-container">


            <div class="doctor-info-right">

                <i class="fa-solid fa-boxes-stacked"></i>

                <div class="doctor-title-box">

                    <h1>
                        تجهیزات و محصولات پزشکی
                    </h1>

                    <span>
                        دکتر محمدصادق تاج
                    </span>

                </div>

            </div>


            <div class="header-buttons">


                <a
                    href="index.html"
                    class="back-btn"
                >

                    <i class="fa-solid fa-arrow-right"></i>

                    بازگشت به صفحه اصلی

                </a>


                <!-- سبد خرید -->

                <a
                    href="panel.html"
                    class="cart-btn"
                >

                    <i class="fa-solid fa-cart-shopping"></i>

                    سبد خرید

                    <span id="cart-count">
                        ۰
                    </span>

                </a>


            </div>

        </div>

    </header>



    <!-- =========================
         MAIN
    ========================= -->

    <main>


        <div class="section-title">

            <i class="fa-solid fa-store"></i>

            <h2>
                لیست محصولات در دسترس
            </h2>

        </div>


        <div
            id="products-container"
            class="products-grid"
        >

            <div class="loading-text">

                <i class="fa-solid fa-spinner fa-spin"></i>

                در حال دریافت لیست محصولات...

            </div>

        </div>


    </main>



    <!-- =========================
         TOAST
    ========================= -->

    <div id="toast">

        محصول به سبد خرید اضافه شد.

    </div>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        © کلیه حقوق برای دکتر محمدصادق تاج محفوظ است.

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        /* ==========================================
           GOOGLE SHEETS
        ========================================== */

        const SHEET_ID =
            '138i-vFOWfolwYGW7brhRAiHFjuVtpDU0sF2bHdyMYQg';

        const SHEET_TITLE =
            'Sheet1';

        const FULL_URL =
            'https://docs.google.com/spreadsheets/d/' +
            SHEET_ID +
            '/gviz/tq?sheet=' +
            SHEET_TITLE;



        /* ==========================================
           CART
        ========================================== */

        const CART_KEY =
            'taj_medical_cart';



        /* ==========================================
           دریافت سبد خرید
        ========================================== */

        function getCart() {

            try {

                return JSON.parse(
                    localStorage.getItem(CART_KEY)
                ) || [];

            } catch (error) {

                console.error(
                    'خطا در خواندن سبد خرید:',
                    error
                );

                return [];

            }

        }



        /* ==========================================
           ذخیره سبد خرید
        ========================================== */

        function saveCart(cart) {

            localStorage.setItem(
                CART_KEY,
                JSON.stringify(cart)
            );

        }



        /* ==========================================
           اضافه کردن محصول به سبد
        ========================================== */

        function buyProduct(
            id,
            title,
            price,
            image
        ) {


            const cart =
                getCart();



            /* بررسی اینکه محصول قبلاً در سبد هست یا نه */

            const existingProduct =
                cart.find(
                    item => item.id === id
                );



            if (existingProduct) {

                /* اگر محصول قبلاً وجود دارد */

                existingProduct.quantity =
                    (Number(existingProduct.quantity) || 1) + 1;

            } else {

                /* محصول جدید */

                cart.push({

                    id: id,

                    name: title,

                    title: title,

                    price: Number(price) || 0,

                    image: image,

                    quantity: 1

                });

            }



            /* ذخیره */

            saveCart(cart);



            /* بروزرسانی تعداد */

            updateCartCount();



            /* نمایش پیام */

            showToast(
                'محصول «' + title + '» به سبد خرید اضافه شد ✓'
            );



            /* تغییر دکمه */

            const buttons =
                document.querySelectorAll('.order-btn');


            buttons.forEach(function(button) {

                const buttonId =
                    button.getAttribute('data-product-id');


                if (buttonId === id) {

                    button.classList.add('added');

                    button.innerHTML =
                        '<i class="fa-solid fa-check"></i> به سبد اضافه شد';


                    setTimeout(function() {

                        button.classList.remove('added');

                        button.innerHTML =
                            '<i class="fa-solid fa-cart-shopping"></i> خرید محصول';

                    }, 1500);

                }

            });

        }



        /* ==========================================
           تعداد محصولات سبد
        ========================================== */

        function updateCartCount() {


            const cart =
                getCart();



            const totalCount =
                cart.reduce(
                    function(total, item) {

                        return total +
                            (Number(item.quantity) || 1);

                    },
                    0
                );



            const cartCount =
                document.getElementById('cart-count');



            if (cartCount) {

                cartCount.textContent =
                    totalCount.toLocaleString('fa-IR');

            }

        }



        /* ==========================================
           نمایش پیام
        ========================================== */

        function showToast(message) {


            const toast =
                document.getElementById('toast');


            toast.textContent =
                message;


            toast.classList.add('show');



            setTimeout(function() {

                toast.classList.remove('show');

            }, 2200);

        }



        /* ==========================================
           دریافت محصولات از Google Sheets
        ========================================== */

        fetch(FULL_URL)

            .then(function(res) {

                return res.text();

            })


            .then(function(rep) {


                var data =
                    JSON.parse(
                        rep.substr(47).slice(0, -2)
                    );


                var rows =
                    data.table.rows;


                var container =
                    document.getElementById(
                        'products-container'
                    );


                container.innerHTML = '';



                if (!rows || rows.length === 0) {

                    container.innerHTML =
                        '<div class="loading-text">' +
                        'هیچ محصولی ثبت نشده است.' +
                        '</div>';

                    return;

                }



                /* ==========================================
                   ساخت کارت محصولات
                ========================================== */

                rows.forEach(function(row, index) {


                    /* نام محصول */

                    var title =
                        (
                            row.c &&
                            row.c[0] &&
                            row.c[0].v
                        )
                        ?
                        String(row.c[0].v)
                        :
                        'دستگاه پزشکی';



                    /* توضیحات */

                    var desc =
                        (
                            row.c &&
                            row.c[1] &&
                            row.c[1].v
                        )
                        ?
                        String(row.c[1].v)
                        :
                        '';



                    /* قیمت */

                    var price =
                        (
                            row.c &&
                            row.c[2] &&
                            row.c[2].v
                        )
                        ?
                        row.c[2].v
                        :
                        0;



                    /* تصویر */

                    var image =
                        (
                            row.c &&
                            row.c[3] &&
                            row.c[3].v
                        )
                        ?
                        String(row.c[3].v)
                        :
                        'https://via.placeholder.com/300x200/0f172a/14b8a6?text=Medical+Product';



                    /* ==========================================
                       شناسه منحصر به فرد محصول
                    ========================================== */

                    var productId =
                        'sheet-product-' + index;



                    /* ==========================================
                       قیمت برای نمایش
                    ========================================== */

                    var formattedPrice;


                    if (
                        typeof price === 'number' &&
                        !isNaN(price)
                    ) {

                        formattedPrice =
                            price.toLocaleString('fa-IR') +
                            ' تومان';

                    } else {

                        formattedPrice =
                            String(price);

                    }



                    /* ==========================================
                       HTML کارت
                    ========================================== */

                    var card =
                        document.createElement('div');


                    card.className =
                        'product-card';



                    /* تصویر */

                    var img =
                        document.createElement('img');


                    img.src =
                        image;


                    img.alt =
                        title;


                    img.className =
                        'product-image';


                    img.onerror =
                        function() {

                            this.src =
                                'https://via.placeholder.com/300x200/0f172a/14b8a6?text=Medical+Product';

                        };



                    /* عنوان */

                    var titleElement =
                        document.createElement('div');


                    titleElement.className =
                        'product-title';


                    titleElement.textContent =
                        title;



                    /* توضیحات */

                    var descElement =
                        document.createElement('div');


                    descElement.className =
                        'product-desc';


                    descElement.textContent =
                        desc;



                    /* قیمت */

                    var priceElement =
                        document.createElement('div');


                    priceElement.className =
                        'product-price';


                    priceElement.textContent =
                        formattedPrice;



                    /* دکمه */

                    var button =
                        document.createElement('button');


                    button.className =
                        'order-btn';


                    button.setAttribute(
                        'data-product-id',
                        productId
                    );


                    button.innerHTML =
                        '<i class="fa-solid fa-cart-shopping"></i> خرید محصول';



                    /* ==========================================
                       کلیک خرید
                    ========================================== */

                    button.addEventListener(
                        'click',
                        function() {


                            /*
                             * قیمت را به عدد تبدیل می‌کنیم
                             */

                            var numericPrice =
                                parseFloat(price);


                            if (
                                isNaN(numericPrice)
                            ) {

                                numericPrice = 0;

                            }



                            buyProduct(
                                productId,
                                title,
                                numericPrice,
                                image
                            );

                        }
                    );



                    /* ==========================================
                       ساخت کارت
                    ========================================== */

                    card.appendChild(img);

                    card.appendChild(titleElement);


                    if (desc) {

                        card.appendChild(
                            descElement
                        );

                    }


                    card.appendChild(priceElement);

                    card.appendChild(button);


                    container.appendChild(card);

                });

            })


            /* ==========================================
               خطا
            ========================================== */

            .catch(function(err) {


                console.error(err);


                document.getElementById(
                    'products-container'
                ).innerHTML =

                    '<div class="loading-text" style="color:#ef4444;">' +

                    '<i class="fa-solid fa-triangle-exclamation"></i> ' +

                    'خطا در دریافت لیست محصولات. ' +

                    'لطفاً بررسی کنید دسترسی شیت عمومی (Public) باشد.' +

                    '</div>';

            });



        /* ==========================================
           اجرای اولیه
        ========================================== */

        updateCartCount();


    </script>


</body>

</html>
