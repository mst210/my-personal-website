    <!-- Script to Fetch Products from Google Sheets -->
    <script>
        const SHEET_ID = '138i-vFOWfolwYGW7brhRAiHFjuVtpDU0sF2bHdyMYQg';
        const SHEET_TITLE = 'Sheet1';
        const FULL_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${SHEET_TITLE}`;

        fetch(FULL_URL)
            .then(res => res.text())
            .then(rep => {
                const data = JSON.parse(rep.substr(47).slice(0, -2));
                const rows = data.table.rows;
                const container = document.getElementById('products-container');
                container.innerHTML = '';

                if (!rows || rows.length === 0) {
                    container.innerHTML = '<div class="loading-text">هیچ محصولی ثبت نشده است.</div>';
                    return;
                }

                // خواندن تمام سطرها از همان سطر اول (index 0)
                rows.forEach(row => {
                    const title = row.c && row.c[0] ? row.c[0].v : 'دستگاه پزشکی';
                    const desc = row.c && row.c[1] ? row.c[1].v : '';
                    const price = row.c && row.c[2] ? row.c[2].v : 'تماس بگیرید';
                    // اگر در ستون D (ستون چهارم) لینکی برای عکس بگذارید نشان می‌دهد، در غیر این صورت عکس پیش‌فرض می‌گذارد
                    const image = row.c && row.c[3] ? row.c[3].v : 'https://via.placeholder.com/300x200/0f172a/14b8a6?text=Medical+Product';

                    // فرمت‌دهی قیمت
                    const formattedPrice = typeof price === 'number' ? price.toLocaleString('fa-IR') + ' تومان' : price;

                    const cardHTML = `
                        <div class="product-card">
                            <div>
                                <img src="${image}" alt="${title}" class="product-image" onerror="this.src='https://via.placeholder.com/300x200/0f172a/14b8a6?text=Medical+Product'">
                                <div class="product-title">${title}</div>
                                ${desc ? `<div class="product-desc">${desc}</div>` : ''}
                            </div>
                            <div>
                                <div class="product-price">${formattedPrice}</div>
                                <button onclick="Goftino.open()" class="order-btn">
                                    <i class="fa-solid fa-headset"></i> ثبت سفارش / مشاوره
                                </button>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('products-container').innerHTML = 
                    '<div class="loading-text" style="color: #ef4444;">خطا در دریافت لیست محصولات. لطفاً بررسی کنید دسترسی شیت عمومی (Public) باشد.</div>';
            });
    </script>
